# Soothe daemon development configuration.
# Uses thread pool for faster startup (~ms vs ~8s subprocess spawn).
# Install: ~/.soothe/config/daemon_config.yml (symlink or copy for dev)

# ============================================================================
# TRANSPORTS - Network listeners for daemon communication
# ============================================================================
transports:
  websocket:  # Primary transport for CLI/TUI clients
    enabled: true
    host: 127.0.0.1
    port: 8765
  http_rest:  # Optional REST API (health checks, metrics)
    enabled: false

# ============================================================================
# CONCURRENCY - Limits for parallel execution and resource protection
# ============================================================================
max_concurrent_threads: 100          # Higher for dev testing
max_concurrent_dispatches: 50
max_concurrent_vision_preflight: 8
max_input_queue_size: 1000

# ============================================================================
# TIMEOUTS & CANCELLATION - Shorter timeouts for faster dev iteration
# ============================================================================
max_query_duration_minutes: 0        # 0 = unlimited
thread_max_age_hours: 24
cancel_grace_seconds: 10             # Faster cancel for dev testing
cancel_retry_count: 3
cancel_retry_interval_seconds: 1.0   # Faster retry interval
cancel_force_kill_timeout_seconds: 5.0  # Shorter force kill timeout
query_timeout_action: cancel
auto_cancel_on_startup: true

# ============================================================================
# EPHEMERAL LOOP GC
# ============================================================================
ephemeral_loop_gc:
  enabled: true
  interval_seconds: 3600
  idle_hours: 24
  batch_size: 50

# Stale worker reap only applies when worker_pool is enabled (dev uses thread_pool).
stale_worker_reap:
  enabled: true
  interval_seconds: 1800

# ============================================================================
# OBSERVABILITY - Diagnostic metrics and logging
# ============================================================================
event_size_stats_enabled: true
event_size_stats_interval_seconds: 30   # More frequent for dev diagnostics

# ============================================================================
# RUNNER MODES - Thread pool enabled for faster dev iteration
#
# PostgreSQL (IG-406): thread_pool shares ONE checkpointer pool + ONE AgentLoop pool
# in the daemon process (defaults: postgres_pool_min_size 4, pool max 24 each).
# ============================================================================
thread_pool:
  enabled: true                      # Dev default: thread pool for fast startup
  min_pool_size: 2
  max_pool_size: 6
  idle_timeout_seconds: 120          # Exit idle threads faster → release runner/PG pressure
  max_requests_per_thread: 50        # Recycle threads periodically

worker_pool:
  enabled: false                     # Disabled: thread pool takes precedence

distributed:
  enabled: false                     # Disabled for local dev