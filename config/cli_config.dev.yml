# Development CLI configuration — daemon connection and CLI log file level.
# Symlink to ~/.soothe/config/cli_config.yml for development
#
# Usage:
#   mkdir -p ~/.soothe/config
#   ln -sf /Users/chenxm/Workspace/Soothe/config/cli_config.dev.yml ~/.soothe/config/cli_config.yml
#
# Note: Subscription/event display verbosity is not read from this file today; the TUI uses
# a fixed bootstrap level. Theme and other UI prefs live in ~/.soothe/config/config.yml (ui.theme).
# WebSocket connect retries/timeouts are fixed in the SDK (soothe_sdk.client.session).

# Python logging level for ~/.soothe/logs/soothe-cli.log. SOOTHE_LOG_LEVEL overrides when set.
logging_level: DEBUG

daemon:
  transports:
    websocket:
      host: "127.0.0.1"
      port: 8765
