# Soothe Configuration Template
# ------------------------------------------------------------------------------
# Full YAML aligned with Pydantic defaults in ``packages/soothe/src/soothe/config/``
# (``models.py``, ``settings.py``). Values match those defaults except documented
# examples: OpenAI ``providers`` sample, ``sqlite_vec`` store + router.
#
# Usage: soothe --config /path/to/this-file.yaml
# Local dev: start from config/config.dev.yml and adjust providers.
# Secrets: use ``${ENV_VAR}`` under providers; export OPENAI_API_KEY, etc.
# Optional tool env: TAVILY_API_KEY, JINA_API_KEY, SERPER_API_KEY, GITHUB_TOKEN.

# ============================================================
# AGENT (Identity, Behavior, Self-Driving, Loop, Protocols)
# ============================================================
# All agent-related settings consolidated in one section (IG-434).
# Progressive disclosure: basic → behavior → autonomous → loop → protocols.

agent:
  # === BASIC (User Identity) ===
  name: Soothe
  system_prompt: null

  # === BEHAVIOR (Response Mode) ===
  goal_completion_mode: llm_only
  final_response: adaptive

  # === AUTONOMOUS (Self-Driving - Unified) ===
  # Merged former 'autonomous' + 'autopilot' sections (IG-434).
  # Controls 24/7 self-running behavior for both goal-level and daemon-level.
  autonomous:
    enabled_by_default: false

    # Goal execution limits
    max_iterations: 10
    max_retries: 2
    max_total_goals: 50
    max_goal_depth: 5
    max_parallel_goals: 3
    enable_dynamic_goals: true

    # Orchestration
    max_send_backs: 3
    checkpoint_interval: 10

    # Dreaming (background consolidation)
    dreaming_enabled: true
    dreaming_consolidation_interval: 300
    dreaming_health_check_interval: 60

    # Scheduled tasks
    scheduler_enabled: true
    max_scheduled_tasks: 100
    webhooks: {}

  # === LOOP (AgentLoop Internal Tuning) ===
  # Rarely edited. Defaults optimized for most use cases.
  loop:
    enabled: true
    max_iterations: 10
    max_subagent_tasks_per_wave: 4
    prior_conversation_limit: 10
    context_window_limit: 200000

    # Output streaming (RFC-614)
    output_streaming:
      mode: adaptive
      streaming_interval_ms: 300
      message_coalesce_enabled: true
      tool_batch_enabled: true
      tool_batch_interval_ms: 200
      suppress_redundant_stream_tool_updates: true
      skip_redundant_tool_message_wire: false
      tui_flush_interval_ms: 200

    # Planning
    planning:
      simple_max_tokens: 50
      complexity_threshold: 160
      force_keywords:
      - plan for
      - create a plan
      - steps to
      adaptive_escalation: true

    # Early termination
    early_termination:
      enabled: true
      completion_signals:
      - task complete
      - done
      - finished successfully
      error_threshold: 3

    # Working memory
    working_memory:
      enabled: true
      max_inline_chars: 4000
      max_entry_chars_before_spill: 1500

    # Goal context
    goal_context:
      plan_limit: 10
      execute_limit: 10
      enabled: true

    # Report output
    report_output:
      display_threshold: 20000
      preview_chars: 500
      synthesis_max_chars: 0

    # Infrastructure limits (rate limiting, concurrency, timeouts)
    limits:
      max_parallel_goals: 1
      max_parallel_steps: 2
      max_parallel_subagents: 4
      max_parallel_tools: 15
      global_max_llm_calls: 5
      step_parallelism: dependency
      llm_rpm_limit: 120
      llm_concurrent_limit: 10
      llm_call_timeout_seconds: 120
      llm_call_timeout_adaptive: true
      llm_call_timeout_max_seconds: 120
      llm_retry_on_timeout: true
      llm_max_timeout_retries: 2
      llm_timeout_retry_multiplier: 2.0
      recovery:
        progressive_checkpoints: true
        auto_resume_on_start: false
      tool_call_limit:
        global_thread_limit: 150
        global_run_limit: 56
        tool_specific_limits:
          wizsearch_search:
            thread_limit: 5
            run_limit: 3
          wizsearch_crawl:
            thread_limit: 5
            run_limit: 3
          web_search:
            thread_limit: 5
            run_limit: 3
          fetch_url:
            thread_limit: 5
            run_limit: 3
          search:
            thread_limit: 5
            run_limit: 3
      tool_retry:
        max_retries: 3
        backoff_factor: 2.0
        initial_delay: 1.0

  # === PROTOCOLS (Backend Selection) ===
  protocols:
    memory:
      enabled: true
      persist_dir: null
      llm_chat_role: fast
      llm_embed_role: embedding
      enable_embeddings: true
      enable_auto_categorization: true
      enable_category_summaries: true
      memory_categories:
      - name: personal_info
        description: Personal information
      - name: preferences
        description: User preferences and interests
      - name: knowledge
        description: Facts and learned information
      - name: experiences
        description: Past experiences and events
      - name: goals
        description: Goals and objectives
    planner:
      model: think
      use_fast_model: true
      routing: auto
      planner_model: think
    policy:
      profile: standard
    durability:
      backend: default
      checkpointer: default
      persist_dir: null
      thread_inactivity_timeout_hours: 72

  # === CODE INTERPRETER (Embedded QuickJS) ===
  code_interpreter:
    enabled: true
    ptc_allowlist: []
    memory_limit_mb: 128
    timeout_seconds: 30
    max_ptc_calls: 50
    max_result_size: 10000
    console_capture: true
    snapshot_between_turns: false

# ============================================================
# PROVIDERS (LLM & Embedding Models)
# ============================================================
providers:
- name: openai
  provider_type: openai
  api_key: ${OPENAI_API_KEY}
  api_base_url: null
  models:
  - gpt-4o
  - gpt-4o-mini
  - o3-mini

  # OpenAI-compatible (DashScope, OpenRouter, vLLM):
  # - name: dashscope
  #   provider_type: openai
  #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   models: [qwen-max]

  # LMStudio / Ollama — use provider_type: limited_openai
  # - name: lmstudio
  #   provider_type: limited_openai
  #   api_base_url: http://localhost:1234/v1
  #   api_key: "lmstudio"
  #   models: [google/gemma-4-26b-a4b]

  # Anthropic:
  # - name: anthropic
  #   provider_type: anthropic
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   models: [claude-sonnet-4-20250514]

router:
  default: openai:gpt-4o-mini
  think: null
  fast: null
  image: null
  embedding: null

embedding_dims: 1536

# ============================================================
# TOOLS (Capabilities Available to Agent)
# ============================================================
tools:
  execution:
    enabled: true
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
    - tavily
    max_results_per_engine: 10
    timeout: 30
  image:
    enabled: true
  audio:
    enabled: true
  video:
    enabled: true
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    headers: {}
    verify_ssl: true
  # DeepXiv: Academic paper search and progressive reading (enabled by default)
  # Token: set DEEPXIV_API_KEY or DEEPXIV_TOKEN, or override token below
  # Register at https://data.rag.ac.cn (10,000 req/day); omit token for anonymous tier
  deepxiv:
    enabled: true
    token: null
    timeout: 60
    max_retries: 3

# ============================================================
# SUBAGENTS (Specialized Helper Agents)
# ============================================================
subagents:
  explore:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      thoroughness: medium
      max_iterations:
        quick: 6
        medium: 10
        thorough: 16
      max_read_lines: 50
      max_matches_returned: 5
      max_history_messages_for_model: 8
      max_tool_output_chars_per_turn: 2000
      early_stop_no_new_findings_turns: 2
      max_findings_for_synthesis: 20
      enable_semantic_similarity: true
      semantic_similarity_timeout_seconds: 10
      synthesis_timeout_seconds: 120
    runtime_dir: ''
  plan:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}
    runtime_dir: ''
  tacitus:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      llm_role: fast
      synthesis_role: think
      effort: normal
    runtime_dir: ''

# ============================================================
# MCP SERVERS, PLUGINS, SKILLS, MEMORY
# ============================================================
mcp_servers: []
plugins: []
skills: []
memory: []

# ============================================================
# UI & OBSERVABILITY
# ============================================================
debug: false
activity_max_lines: 300
tui_debug: false
ui:
  theme: null

observability:
  log_file_level: INFO
  log_file_path: null
  log_file_max_bytes: 5242880
  log_file_backup_count: 3
  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: '%(level_short)s %(name)s %(message)s'
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  verbosity: normal
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  thread_logging_max_size_mb: 100
  langfuse:
    enabled: false
    public_key: null
    secret_key: null
    host: null
    environment: null
    release: null
    sample_rate: null
    trace_name: null
    tags: null
    user_id: null

update:
  check: true
  auto_update: true

# ============================================================
# PERSISTENCE & STORAGE
# ============================================================
persistence:
  postgres_base_dsn: null
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory
  soothe_postgres_dsn: postgresql://postgres:postgres@localhost:5432/soothe
  default_backend: sqlite
  postgres_pool_min_size: 4
  checkpointer_pool_size: 24
  agentloop_pool_size: 24
  postgres_pool_max_idle_seconds: 120
  postgres_pool_max_lifetime_seconds: 1800
  postgres_pool_acquire_timeout_seconds: 30
  metadata_sqlite_path: null
  checkpoint_sqlite_path: null

vector_stores:
- name: sqlite_vec_default
  provider_type: sqlite_vec

vector_store_router:
  default: sqlite_vec_default:soothe_default

# ============================================================
# SECURITY
# ============================================================
security:
  sandbox: false
  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true
  denied_paths:
  - /etc/**
  - /bin/**
  - /sbin/**
  - /usr/**
  - /System/**
  - /Library/**
  - /private/etc/**
  - ~/.ssh/**
  - ~/.gnupg/**
  - ~/.aws/**
  - '**/.env'
  - '**/credentials.json'
  - '**/secrets.json'
  allowed_paths:
  - '**'
  denied_file_types: []
  require_approval_for_file_types:
  - .env
  - .pem
  - .key
  - .p12
  - .pfx
  - .crt
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []

filesystem_middleware:
  backup_enabled: true
  backup_dir: null
  workspace_root: null
  virtual_mode: false
  max_file_size_mb: 10
  tool_token_limit_before_evict: 20000

# ============================================================
# OPTIMIZATION (Semantic Heuristics)
# ============================================================
# IG-433: Replaces fragile keyword/regex matching with LLM-based approaches.
# All features have graceful fallback to legacy heuristics when LLM unavailable.
optimization:
  semantic_risk:
    enabled: true
    cache_enabled: true
    cache_similarity_threshold: 0.9
    confidence_threshold: 0.5
  semantic_relationships:
    enabled: true
    auto_apply_threshold: 0.85
    flag_threshold: 0.70
  failure_intent:
    enabled: true
    llm_confidence_threshold: 0.7
  structured_plan:
    enabled: false
  scenario_registry:
    enabled: true
    config_path: null
    embedding_match_threshold: 0.75
  tool_result_registry:
    enabled: true

# ============================================================
# WORKSPACE CONFIGURATION
# ============================================================
# Daemon fallback workspace defaults to a temp directory (override with SOOTHE_WORKSPACE).
# When loop_new sets client_workspace (RPC field: workspace), the runner uses that path directly.
# When client_workspace is unset, persisted sandboxes live under:
#   $SOOTHE_HOME/workspaces/<user>/ws_<hash>/
#   - Empty user_id → directory segment "anonymous"; hash uses "" as the user part.
#   - hash = SHA256(user_id, client_workspace_id or loop_id)[:16]
# The anonymous workspace tree is removed on daemon shutdown.
#
# loop_new RPC fields: client_workspace (or legacy workspace), user_id, client_workspace_id.