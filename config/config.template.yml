# Soothe Configuration Template
# ------------------------------------------------------------------------------
# Usage: soothe --config /path/to/this-file.yaml
# Local dev: start from config/config.dev.yml (repo root) and adjust providers.
# Secrets: use "${ENV_VAR}" under providers/tools; export those variables from your shell
#   or CI (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY, DASHSCOPE_API_KEY).
# Optional tool keys: TAVILY_API_KEY, JINA_API_KEY, SERPER_API_KEY, GITHUB_TOKEN (see tools.*).
# Langfuse: observability.langfuse block below; local Docker defaults in docker-compose.yml.
# Infra env for compose (Postgres, etc.): see docker-compose.yml at repo root.

# Model Providers - Define LLM providers with API keys (supports ${ENV_VAR} syntax)

providers:
  - name: openai
    provider_type: openai
    api_key: "${OPENAI_API_KEY}"
    # api_base_url: https://api.openai.com/v1
    models:
      - gpt-4o
      - gpt-4o-mini
      - o3-mini

  # OpenAI-compatible (DashScope, OpenRouter, vLLM):
  # - name: dashscope
  #   provider_type: openai
  #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   models: [qwen-max]

  # LMStudio/Ollama (local models) - Limited tool_choice support, use provider_type: limited_openai
  # - name: lmstudio
  #   provider_type: limited_openai
  #   api_base_url: http://localhost:1234/v1
  #   api_key: "lmstudio"
  #   models: [google/gemma-4-26b-a4b]

  # Anthropic:
  # - name: anthropic
  #   provider_type: anthropic
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   models: [claude-sonnet-4-20250514]

# Model Router - Maps purpose roles to "provider:model" (unset roles inherit from "default")

router:
  default: "openai:gpt-4o-mini"
  fast: "openai:gpt-4o-mini"
  think: "openai:o3-mini"
  image: "openai:gpt-4o"
  embedding: "openai:text-embedding-3-small"

# Autonomous Operation - Requires explicit user activation per thread (default: disabled)

autonomous:
  enabled_by_default: false
  max_iterations: 10
  max_retries: 2
  max_total_goals: 50        # RFC-0007 §5.6
  max_goal_depth: 5          # RFC-0007 §5.6
  enable_dynamic_goals: true # RFC-0007 §5.4

# Agentic loop (RFC-201, RFC-220)

agentic:
  max_iterations: 10
  max_subagent_tasks_per_wave: 16  # 0 = unlimited
  agent_loop_output_contract_enabled: true
  final_response: adaptive  # adaptive | always_synthesize
  goal_completion_mode: llm_only  # llm_only | heuristic_only | hybrid
  prior_conversation_limit: 10

  goal_context:
    plan_limit: 10
    execute_limit: 10
    enabled: true

  working_memory:
    enabled: false
    max_inline_chars: 2000
    max_entry_chars_before_spill: 4000

  context_window_limit: 200000

  output_streaming: true

  reject_done_at_iteration_zero: false
  loop_orchestrator_evidence_validate: true

  report_output:
    display_threshold: 20000
    preview_chars: 500
    synthesis_max_chars: 0  # 0 = unlimited

  plan_prompt_ledger:  # IG-380 caps for plan prompts; 0 = no cap
    plan_ledger_max_messages: 0
    plan_ledger_max_total_chars: 0
    plan_ledger_max_message_chars: 0

# Execution limits (0 = unlimited)

execution:
  llm_rpm_limit: 120
  llm_concurrent_limit: 10
  llm_call_timeout_seconds: 120
  llm_call_timeout_max_seconds: 240  # IG-399: fail fast on pathological long calls
  llm_call_timeout_adaptive: true
  # IG-295: Retry with timeout escalation (graceful degradation)
  llm_retry_on_timeout: true
  llm_max_timeout_retries: 2
  llm_timeout_retry_multiplier: 2.0
  concurrency:
    max_parallel_goals: 1
    max_parallel_steps: 2
    max_parallel_subagents: 4
    global_max_llm_calls: 5
    step_parallelism: dependency  # sequential | dependency | max
  # Tool call limits (ToolCallLimitMiddleware; explore subagent batches many fs tools per turn)
  tool_call_limit:
    global_thread_limit: 150  # Cap across a thread (explore + multi-turn search)
    global_run_limit: 56     # Cap per single agent invocation (parallel glob/ls waves)
    tool_specific_limits:  # Tool-specific overrides for web search related tools
      wizsearch_search: {thread_limit: 5, run_limit: 3}
      wizsearch_crawl: {thread_limit: 5, run_limit: 3}
      web_search: {thread_limit: 5, run_limit: 3}
      fetch_url: {thread_limit: 5, run_limit: 3}
      search: {thread_limit: 5, run_limit: 3}
  # Tool retry config (ToolRetryMiddleware)
  tool_retry:
    max_retries: 3
    backoff_factor: 2.0
    initial_delay: 1.0
  recovery:
    progressive_checkpoints: true  # RFC-0010
    auto_resume_on_start: false

# Observability Configuration - Unified debugging and monitoring settings

observability:
  log_file_level: INFO  # Logging level for file output (DEBUG, INFO, WARNING, ERROR)
  log_file_path: null  # Log file path (empty = SOOTHE_HOME/logs/soothed.log)
  log_file_max_bytes: 5242880  # 5 MB - Maximum file size before rotation
  log_file_backup_count: 3  # Number of rotating backup files

  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: "%(level_short)s %(name)s %(message)s"

  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90

  verbosity: normal  # Verbosity level: quiet, normal, detailed, debug

  thread_logging_enabled: true  # Whether thread-specific logging is enabled
  thread_logging_retention_days: 30  # Days to retain thread logs before cleanup
  thread_logging_max_size_mb: 100  # Maximum total size for thread logs directory

  # Langfuse LLM observability (optional: pip install 'soothe[langfuse]')
  langfuse:
    enabled: false
    public_key: null  # or "${LANGFUSE_PUBLIC_KEY}"
    secret_key: null  # or "${LANGFUSE_SECRET_KEY}"
    host: null  # default cloud host; set for self-hosted (e.g. https://langfuse.example.com)
    environment: null  # e.g. production, staging
    release: null  # deployment release label
    sample_rate: null  # optional 0.0–1.0 client sampling
    trace_name: null  # optional RunnableConfig run_name for root graph runs
    tags: null  # optional list e.g. [soothe, production] → Langfuse trace tags (Cost Dashboard filters)
    user_id: null  # optional Langfuse user id; supports ${ENV} (maps to langfuse_user_id metadata)

# Daemon Multi-Transport Configuration (RFC-0013) - WebSocket (required) + HTTP REST (optional)

daemon:
  transports:
    websocket:
      enabled: true
      host: "127.0.0.1"
      port: 8765
      tls_enabled: false
      cors_origins: ["http://localhost:*", "http://127.0.0.1:*"]
      max_frame_size: 10485760  # 10MB
    http_rest:
      enabled: false
      host: "127.0.0.1"
      port: 8766
      tls_enabled: false
      cors_origins: ["http://localhost:*", "http://127.0.0.1:*"]

  max_concurrent_threads: 100  # RFC-402
  # IG-398: await window after task.cancel() before slow-unwind warning (subagent unwind can exceed 2s)
  cancel_grace_seconds: 30
  max_input_queue_size: 1000  # IG-258: Prevents unbounded memory growth
  max_concurrent_dispatches: 50  # IG-258: Prevents task explosion
  # IG-403: EventBus JSON wire-size distribution (streaming histogram; constant memory)
  event_size_stats_enabled: false
  event_size_stats_interval_seconds: 60
  event_size_stats_idle_pause_seconds: 120

# Subagents - Enabled by default (set enabled: false to disable)

subagents:
  browser:
    enabled: false
    config:
      max_steps: 10  # Browser-use agent loop limit per delegated task
      runtime_dir: ""  # Empty = use SOOTHE_HOME/agents/browser/
      downloads_dir: ""  # Empty = runtime_dir/downloads/
      user_data_dir: ""  # Empty = runtime_dir/profiles/default/
      extensions_dir: ""  # Empty = runtime_dir/extensions/
      cleanup_on_exit: true  # Clean temp files on session end
      disable_extensions: true  # Disable uBlock Origin, cookie handler, ClearURLs
      disable_cloud: true  # Disable browser-use cloud service
      disable_telemetry: true  # Disable anonymous usage telemetry
      enable_existing_browser: true  # Allow connecting to existing Chrome via CDP
      profile_mode: ephemeral  # for concurrent browser tasks

  claude:
    enabled: true
    # Claude subagent uses ANTHROPIC_API_KEY and model from environment
    # Set environment variables: ANTHROPIC_API_KEY, ANTHROPIC_MODEL (optional)
    # No model configuration needed here

  research:
    enabled: true
    # Research subagent for deep multi-source iterative research
    # Uses the InquiryEngine for comprehensive investigation
    # No additional configuration needed - uses wizsearch tool settings

  explore:
    enabled: true
    # Explore subagent uses router fast role by default
    # Explore subagent for targeted filesystem search (RFC-613)
    # Uses LLM-orchestrated iterative search with configurable thoroughness
    config:
      thoroughness: "medium"  # IG-399: quick (6), medium (10), thorough (16) model-turn cap
      max_iterations:
        quick: 6      # IG-399: -50% from 12
        medium: 10    # IG-399: -58% from 24
        thorough: 16  # IG-399: -67% from 48
      max_read_lines: 50  # Max lines per read_file call
      max_matches_returned: 5  # Max matches in final result
      # IG-399: context growth capping
      max_history_messages_for_model: 8  # Keep only recent N message turns
      max_tool_output_chars_per_turn: 2000  # Truncate oversized tool outputs
      early_stop_no_new_findings_turns: 2  # Force synthesis when findings stall
      # Explore uses execution.tool_call_limit (ToolCallLimitMiddleware). Optional overrides:
      # tool_call_limit_run, tool_call_limit_thread (see ExploreSubagentConfig).

# =============================================================================
# Tools Configuration
# =============================================================================
# Enable/disable tool groups and configure their settings.
# Each tool group can be enabled/disabled via the 'enabled' flag.

tools:
  # Consolidated execution tools
  execution:
    enabled: true       # run_command, run_python, run_background, kill_process

  # Consolidated file operations (merged with surgical editing)
  file_ops:
    enabled: true       # delete_file, file_info, edit_file_lines, insert_lines, delete_lines, apply_diff
    # NOTE: read_file, write_file, search_files, list_files are provided by deepagents FilesystemMiddleware

  # Data operations
  datetime:
    enabled: true       # Current date/time for time-awareness
  data:
    enabled: true       # Inspect tabular data (CSV, Excel) and documents (PDF, DOCX)

  # Enhanced multi-engine search (formerly web_search, now wizsearch)
  wizsearch:
    enabled: true       # wizsearch_search, wizsearch_crawl
    default_engines:
      - tavily          # Requires TAVILY_API_KEY (tavily-only default)
    crawler: wizsearch    # Or jina, requires JINA_API_KEY
    max_results_per_engine: 10
    timeout: 30

  # Optional tools (require API keys or external services):
  image:
    enabled: false   # Image analysis (OpenAI GPT-4o)
  audio:
    enabled: false   # Audio transcription (OpenAI Whisper)
  video:
    enabled: false   # Video analysis (Google Gemini)

  # LangChain Community RequestsToolkit (GET/POST/PATCH/PUT/DELETE) (IG-339)
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    verify_ssl: true
    # headers: {}
    # Example:
    # headers:
    #   Authorization: "Bearer ${MY_API_TOKEN}"

# =============================================================================
# MCP Servers
# =============================================================================

mcp_servers: []
  # - command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  #   transport: stdio
  # - url: http://localhost:3000/mcp
  #   transport: sse

# Plugins - Load via entry points, config declaration, or filesystem (~/.soothe/plugins/)

plugins: []
  # Example: Load a plugin via config declaration
  # - name: my-plugin
  #   enabled: true
  #   module: "my_package:MyPlugin"
  #   config:
  #     api_key: "${MY_API_KEY}"
  #     max_results: 10

  # Example: Disable a built-in plugin
  # - name: execution
  #   enabled: false

# Skills & Memory

skills: []
memory: []

# Agent filesystem root (file tools, default working tree). Built-in default:
# $SOOTHE_HOME/Workspace (created when the daemon starts). Override with SOOTHE_WORKSPACE
# or set workspace_dir to an explicit path.
# workspace_dir: "/path/to/your/project"

# Security Configuration - Filesystem access control and security policies

security:
  # Enable sandboxed execution for command tools (execute, run_command, run_python, run_background).
  # When false, these tools are filtered out to avoid "SandboxBackendProtocol" errors.
  # Default: false
  sandbox: false

  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true

  # Path-based access control (glob patterns) - Evaluation: denied_paths > allowed_paths > workspace
  denied_paths:
    - "/etc/**"
    - "/bin/**"
    - "/sbin/**"
    - "/usr/**"
    - "/System/**"
    - "/Library/**"
    - "/private/etc/**"
    - "~/.ssh/**"
    - "~/.gnupg/**"
    - "~/.aws/**"
    - "**/.env"
    - "**/credentials.json"
    - "**/secrets.json"
  allowed_paths:
    - "**"  # Allow all (restrict for tighter security)

  denied_file_types: []
  require_approval_for_file_types: [".env", ".pem", ".key", ".p12", ".pfx", ".crt"]

protocols:
  planner:
    routing: auto  # auto | always_direct | always_planner | always_claude

  policy:
    profile: standard

  memory:
    enabled: true
    persist_dir: ""  # Empty = ~/.soothe/memory/
    llm_chat_role: fast
    llm_embed_role: embedding
    enable_embeddings: true
    enable_auto_categorization: true
    enable_category_summaries: true

  durability:
    thread_inactivity_timeout_hours: 72

# Persistence Configuration - Unified settings for protocol backends (RFC-612 multi-database architecture)

persistence:
  default_backend: sqlite  # sqlite (development) | postgresql (production)

  # RFC-612: PostgreSQL multi-database architecture
  # Uncomment for postgresql production setup:
  # postgres_base_dsn: "postgresql://user:pass@host:port"
  # postgres_databases:
  #   checkpoints: soothe_checkpoints  # LangGraph + AgentLoop checkpoints
  #   metadata: soothe_metadata        # DurabilityProtocol ThreadInfo
  #   vectors: soothe_vectors          # pgvector embeddings
  #   memory: soothe_memory            # MemU long-term memory

  # SQLite paths (used when default_backend: sqlite)
  # metadata_sqlite_path: ""   # Empty = $SOOTHE_DATA_DIR/metadata.db
  # checkpoint_sqlite_path: "" # Empty = $SOOTHE_DATA_DIR/checkpoints.db

# Vector Store Providers - Named backends for VectorContext (similar to LLM providers)
# Supports multiple providers: sqlite_vec (default), pgvector (production), weaviate

vector_stores:
  # SQLite with sqlite-vec extension (default, development and production-ready)
  - name: sqlite_vec_default
    provider_type: sqlite_vec
    db_path: ""  # Optional: Empty uses $SOOTHE_DATA_DIR/vector.db
    vector_size: 1536  # Embedding dimension (adjust for your model)
    distance: cosine  # Distance metric: cosine, l2, or ip (inner product)

  # PostgreSQL with pgvector extension (alternative for high-scale production)
  # - name: pgvector_default
  #   provider_type: pgvector
  #   dsn: "postgresql://postgres:postgres@localhost:5432/vectordb"  # Required for pgvector
  #   pool_size: 5
  #   index_type: hnsw  # hnsw or ivfflat

  # Weaviate vector database (alternative, cloud or self-hosted)
  # - name: weaviate_default
  #   provider_type: weaviate
  #   url: "http://localhost:8080"  # Weaviate server URL
  #   api_key: ""  # Optional: For Weaviate Cloud
  #   grpc_port: 50051  # gRPC port for better performance

vector_store_router:
  default: sqlite_vec_default:soothe_default  # Format: "provider_name:collection_name"

# Logging Configuration - File and console logging settings

# Note: All logging and observability settings are now unified in the 'observability' section above
