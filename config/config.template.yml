# Soothe Configuration Template (SootheConfig)
# ------------------------------------------------------------------------------
# Full reference for packages/soothe/src/soothe/config/{models,settings}.py.
# Values match Pydantic defaults except the OpenAI providers example.
#
# Zero-config: export OPENAI_API_KEY — no YAML required.
# Usage: soothe --config /path/to/this-file.yaml
# Daemon server: config/daemon.template.yml (SootheDaemonConfig — separate file)
# Secrets: ${ENV_VAR} expanded recursively before validation.
# Env overrides: SOOTHE_<KEY> or SOOTHE_<SECTION>__<KEY>
#
# Legacy top-level keys merged at load (prefer nested forms):
#   logging: → observability (+ agent.loop.report_output)
#   strange_loop: → agent.loop

# ============================================================
# MODELS & ROUTING
# ============================================================
# ModelProviderConfig — api_key supports ${ENV_VAR}.
# provider_type: openai | anthropic | ollama.
# OpenAI-compatible endpoints (DashScope, vLLM, LMStudio): provider_type openai + api_base_url.

providers:
- name: openai
  provider_type: openai
  api_key: "${OPENAI_API_KEY}"
  api_base_url: null
  models:
  - gpt-4o
  - gpt-4o-mini
  - o3-mini
  - text-embedding-3-small

# ============================================================
# ROUTER PROFILES
# ============================================================
# RouterProfile — named preset of ModelRouter for chat/image/ocr routing.
# ModelRole keys: default | think | fast | image | ocr (null → default).
# active_router_profile selects preset; env SOOTHE_ACTIVE_ROUTER_PROFILE overrides YAML.

router_profiles:
- name: default
  router:
    default: openai:gpt-4o-mini
    think: null
    fast: null
    image: null
    ocr: null

active_router_profile: default

embedding_profile:
  - model_role: openai:text-embedding-3-small
    embedding_dims: 1536

# ============================================================
# AGENT
# ============================================================
# AgentConfig — identity, self-driving, StrangeLoop, protocol backends.
# goal_completion_mode / final_response at agent.* are mirrored under agent.loop.* for loop reads.

agent:
  # Identity
  name: Soothe
  # Source: prompts/fragments/system/prompts/default_system_body.xml
  # Omit to use the built-in default body; tool guide is appended at runtime for the builtin default.
  # Custom value replaces body only (no tool guide); supports {assistant_name}.
  # system_prompt: null
  agent_instructions_max_chars: 8000
  goal_completion_mode: llm_only
  final_response: auto
  # Autopilot — AutopilotService scheduling and goal pool (AutopilotConfig)
  autopilot:
    enabled: false
    max_iterations: 10
    max_retries: 2
    max_total_goals: 50
    max_goal_depth: 5
    max_parallel_goals: 3
    enable_dynamic_goals: true
    max_send_backs: 3
    checkpoint_interval: 10
    dreaming_enabled: true
    dreaming_consolidation_interval: 300
    dreaming_health_check_interval: 60
    monitor_model_role: think
    consensus_model_role: think
    verify_interval: 30
    dreaming_interval: 300
    dreaming_scope: workspace
    dreaming_modes:
      episodic:
        enabled: true
        max_episodes: 10
        min_success_rate: 0.8
      procedure:
        enabled: true
        max_episodes: 10
        min_success_rate: 0.8
      semantic:
        enabled: true
        max_episodes: 10
        min_success_rate: 0.8
      profile:
        enabled: true
        max_episodes: 10
        min_success_rate: 0.8
    webhooks: {}
    max_loops: 4
    loop_idle_timeout: 300
    poll_interval: 5
    dreaming_poll_interval: 60
    goal_deadline_seconds: 1209600  # 14d wall-clock budget per dispatched goal
    context_projection:
      max_findings: 20
      max_files: 50
      max_plan_steps: 30
      context_retention_hours: 168
    workspace_reservation:
      enabled: true
      strict_overlap: true
  # StrangeLoop — plan/execute loop tuning (StrangeLoopConfig)
  loop:
    enabled: true
    max_iterations: 99
    max_plan_steps_per_wave: 10
    max_tool_calls_per_step: 999
    # Graph stream inactivity watchdog during Execute (seconds). 0 = disabled (default).
    dispatch_timeout_seconds: 0
    execute_action_retry_max: 1
    execute_min_answer_chars: 20
    execute_deliverable_assess: auto
    step_completion_report_max_words: 50
    max_subagent_tasks_per_wave: 4
    strange_loop_output_contract_enabled: true
    goal_completion_mode: llm_only
    final_response: auto
    step_brief_hydration_enabled: true
    prior_conversation_limit: 10
    context_window_limit: 200000
    context_overflow_threshold_pct: 0.8
    context_compaction_target_pct: 0.6
    step_context_check_enabled: false
    plan_assess_model_role: think
    plan_gap_analysis_enabled: true
    plan_generate_model_role: think
    goal_synthesis_model_role: default
    rules:
      completion:
        dag_dependency_threshold: 3
        low_success_rate_threshold: 0.6
        simple_ledger_direct_max_steps: 1
        ledger_direct_max_tool_calls: 50
      scenario:
        skip_llm_when_single_step: true
        skip_llm_when_all_failed: true
        high_step_count_threshold: 4
        low_evidence_volume_threshold: 2000
      plan_safety:
        banned_step_patterns:
          - "^(wrap up|conclude|terminate|stop|halt|cease|end process|close|exit|quit|finish up|complete process|final step|last step|the end)$"
        simple_evidence_min_chars: 200
    # Output delivery: batch | adaptive | streaming (OutputStreamingConfig)
    output_streaming:
      mode: adaptive
      streaming_interval_ms: 100
      tui_flush_interval_ms: 200
      adaptive_threshold_chars: 500
      adaptive_block_chars: 500
      adaptive_block_interval_ms: 250
      file_output_threshold_chars: 0
      file_output_preview_chars: 500
      file_output_dir: null
      message_coalesce_enabled: true
      tool_batch_enabled: true
      tool_batch_interval_ms: 500
      suppress_redundant_stream_tool_updates: true
      skip_redundant_tool_message_wire: true
    # In-loop scratchpad; large entries spill to disk (LoopWorkingMemoryConfig)
    working_memory:
      enabled: true
      max_inline_chars: 4000
      max_entry_chars_before_spill: 1500
    # Prior-goal injection for Plan/Execute (GoalContextConfig)
    goal_context:
      plan_limit: 10
      execute_limit: 10
      enabled: true
    # Context Engine projection caps (ContextEngineConfig)
    context_engine:
      projection_max_goals: 5
      projection_max_steps_per_goal: 10
      projection_max_ledger_chars: 4000
      projection_max_ledger_messages: 20
      projection_max_lineage_chars: 2000
      projection_max_project_instructions_chars: 8000
    # Plan-phase ledger trim; 0 = unlimited (PlanPromptLedgerConfig)
    plan_prompt_ledger:
      plan_ledger_max_messages: 40
      plan_ledger_max_total_chars: 0
      plan_ledger_max_message_chars: 0
    # Assess-only prompt assembly (PlanAssessPromptConfig, IG-557)
    plan_assess_prompt:
      ledger_max_messages: 24
      execute_ai_max_chars: 2048
      keep_head_tail_execute_ai: true
      omit_prior_progress_hint: true
      include_plan_coverage: true
    # Execute-step ledger projection (ExecutePromptLedgerConfig)
    execute_prompt_ledger:
      cross_goal_completion_tail: 3
      predecessor_max_messages: 96
      execute_ai_ledger_max_tokens: 65536
    report_output:
      display_threshold: 20000
      preview_chars: 500
      synthesis_max_chars: 0
    checkpoint:
      progressive: true
      auto_resume_on_start: false
    # Parallelism caps; checkpoint writes are async and coalesced by default
    concurrency:
      max_parallel_goals: 4
      max_parallel_steps: 4
      max_parallel_subagents: 4
      global_max_llm_calls: 10
      step_parallelism: dependency
      max_parallel_tools: 99
      checkpoint:
        flush_interval: 5.0
        close_timeout_seconds: 30
        durable_flush_timeout: 10
    tool_output:
      code_exec_max_output_chars: 32000
      tool_output_max_chars: 10000
    # ToolCallLimitMiddleware per thread/run
    tool_call_limit:
      global_thread_limit: 200
      global_run_limit: 200
      tool_specific_limits:
        wizsearch_search:
          thread_limit: 5
          run_limit: 3
        wizsearch_crawl:
          thread_limit: 5
          run_limit: 3
        web_search:
          thread_limit: 5
          run_limit: 3
        fetch_url:
          thread_limit: 5
          run_limit: 3
        search:
          thread_limit: 5
          run_limit: 3
    tool_retry:
      max_retries: 3
      backoff_factor: 2.0
      initial_delay: 1.0
    # Per-tool invocation timeout middleware (ToolTimeoutConfig)
    tool_timeout:
      enabled: true
      default_seconds: 60.0
      per_tool:
        grep: 30.0
        read_file: 30.0
        browser_use: 1800.0
        task: 18000.0
      skip_tools_with_internal_timeout: true
    # RPM, concurrency, timeouts, 429 retry (LLMRateLimitConfig)
    llm_rate_limit:
      enabled: true
      rpm_limit: 60
      concurrent_limit: 8
      call_timeout_seconds: 600
      call_timeout_max_seconds: 900
      retry_on_timeout: true
      max_timeout_retries: 10
      timeout_retry_multiplier: 1.2
      retry_on_rate_limit: true
      max_rate_limit_retries: 10
      rate_limit_backoff_base: 2.0
      rate_limit_backoff_max: 60.0
      respect_retry_after_header: true
      rate_limit_retry_timeout_seconds: 120
    loop_orchestrator_evidence_validate: true
  # Protocol backends — planner, policy, durability, MemU (ProtocolsConfig)
  protocols:
    memory:
      enabled: false
      persist_dir: null
      llm_chat_role: fast
      llm_embed_role: embedding
      enable_embeddings: true
      enable_auto_categorization: true
      enable_category_summaries: true
      memory_categories:
      - name: personal_info
        description: Personal information
      - name: preferences
        description: User preferences and interests
      - name: knowledge
        description: Facts and learned information
      - name: experiences
        description: Past experiences and events
      - name: goals
        description: Goals and objectives
    planner:
      model: think
      routing: auto
    policy:
      profile: standard
    durability:
      backend: default
      checkpointer: default
      persist_dir: null
      thread_inactivity_timeout_hours: 72
  # QuickJS programmatic tool calling; opt-in (CodeInterpreterConfig)
  code_interpreter:
    enabled: false
    ptc_allowlist: []
    memory_limit_mb: 128
    timeout_seconds: 30
    max_ptc_calls: 50
    max_result_size: 100000
    console_capture: true
    snapshot_between_turns: false
  # CoreAgent cold-start — lazy_core_agent defers graph compile (AgentRuntimeConfig)
  runtime:
    lazy_core_agent: true
    general_purpose_subagent: false
    recursion_limit: 200
    # IG-545: per-hop orchestration (fast) vs generation (default) model roles in CoreAgent
    role_routing:
      enabled: false
      orchestration_model_role: fast
      generation_model_role: default
      max_orchestration_hops: 1
  # ask_user interrupt relay: auto (veritas) or manual TUI (ClarificationConfig)
  clarification:
    auto_policy: veritas
    auto_min_confidence: 0.4
    max_defer_age_hours: 168
    default_mode: auto
  # Auto-answerer for clarification interrupts (VeritasConfig)
  veritas:
    model_role: think
    max_context_steps: 8

# ============================================================
# TOOLS & EXTENSIONS
# ============================================================
# ToolsConfig groups, SubagentConfig overrides, MCP (RFC-412), plugins, skills, memory paths.
# progressive_* — token budget for deferred tool/skill/MCP listings in prompts.
# MCP example: {name, transport: stdio, command, args, defer: true}

tools:
  execution:
    enabled: true
    background_log_dir: null
    background_log_retention_days: 7
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
    - tavily
    max_results_per_engine: 10
    timeout: 30
    # Optional HTTP(S) proxy for search/crawl (e.g. http://127.0.0.1:7890).
    # Process-wide HTTP_PROXY / HTTPS_PROXY still take precedence when set.
    proxy: null
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    headers: {}
    verify_ssl: true
  # DeepXivToolsConfig — academic search; token from ${DEEPXIV_API_KEY} or env
  deepxiv:
    enabled: false
    token: null
    timeout: 60
    max_retries: 3

# SubagentConfig — overrides merge with builtin planner/explorer/deep_research/academic_research/browser_use
subagents:
  planner:
    enabled: true
    model_role: think
    transport: local
    endpoint: null
    config: {}
    runtime_dir: ''
  explorer:
    enabled: false
    model_role: fast
    transport: local
    endpoint: null
    config:
      recursion_limit: 999
    runtime_dir: ''
  deep_research:
    enabled: true
    transport: local
    endpoint: null
    # Nested keys merge into DeepResearchConfig. Empty config uses those defaults:
    #   effort: normal          # normal | thorough
    #   save_reports: false     # false: return full report inline; true: write under .soothe/agents/deep_research/ + short summary
    config: {}
    runtime_dir: ''
  academic_research:
    enabled: true
    transport: local
    endpoint: null
    # Nested keys merge into AcademicResearchConfig. Empty config uses those defaults:
    #   effort: normal          # normal | thorough
    #   save_reports: false     # false: return full report inline; true: write under .soothe/agents/academic_research/ + short summary
    config: {}
    runtime_dir: ''
  browser_use:
    enabled: true
    model_role: default
    transport: local
    endpoint: null
    config: {}
    runtime_dir: ''

# SkillifyConfig — daemon-shared semantic skill warehouse indexing and retrieval
skillify:
  enabled: false
  model_role: embedding
  warehouse_paths: []
  index_collection: soothe_skillify
  index_interval_seconds: 300
  retrieval_top_k: 10

# MCPServerConfig — unique name per server; defer=true for progressive disclosure
# mcp_builtins — opt-in daily-use servers (not connected when empty). All defer=true.
#   Available: playwright, github, slack, postgres, gdrive, chrome-devtools
#   Example: mcp_builtins: [github, playwright]
# Set env vars for tokens/DSN (e.g. GITHUB_PERSONAL_ACCESS_TOKEN, POSTGRES_CONNECTION_STRING).
mcp_servers: []
mcp_builtins: []
progressive_mcp:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20

plugins: []

# SKILL.md source paths (SkillsMiddleware)
skills: []
progressive_skills:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
  core_skills: null
  search_skills_enabled: true
  semantic_search_enabled: true
  semantic_search_min_score: 0.0
  intent_prefetch_enabled: true
  core_intent_auto_invoke_enabled: true
  intent_prefetch_top_k: 2
  intent_prefetch_min_query_chars: 4
progressive_tools:
  enabled: true
  budget_pct: 0.01
  max_listing_chars_per_entry: 120
  min_listing_chars_per_entry: 20
  core_tools: null
  search_tools_enabled: true

# AGENTS.md paths (MemoryMiddleware)
memory: []

# ============================================================
# PERSISTENCE & VECTOR STORES
# ============================================================
# PersistenceConfig — sqlite default; postgresql via postgres_base_dsn (RFC-612).
# postgres_databases maps component → DB name when using multi-DB layout.
# MUST: persistence.default_backend is one mode for the whole process (AGENTS.md §10).
# When default_backend=postgresql, display cards, cron, identity, checkpoints, CE,
# durability/metadata, and autopilot all use PostgreSQL (soothe_metadata / soothe_checkpoints).
# When default_backend=sqlite, use local $SOOTHE_HOME SQLite files — do not mix.
# VectorStoreProviderConfig — sqlite_vec | pgvector | weaviate | in_memory.
# vector_store_router values: provider_name:collection_name.

persistence:
  default_backend: sqlite
  postgres_base_dsn: null
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory
  soothe_postgres_dsn: postgresql://postgres:postgres@localhost:5432/soothe
  postgres_pool_min_size: 4
  checkpoints_pool_size: 32
  metadata_pool_size: 16
  vectors_pool_size: 16
  postgres_pool_max_idle_seconds: 120.0
  postgres_pool_max_lifetime_seconds: 1800.0
  postgres_pool_acquire_timeout_seconds: 45.0
  # Thread-pool + 50–100 loops: shared pools (checkpoints+metadata+vectors), use PgBouncer.
  sqlite_reader_pool_size: 8
  archive_enabled: true
  archive_retention_days: 90
  archive_max_count: 1000

vector_stores:
- name: sqlite_vec_default
  provider_type: sqlite_vec
  dsn: null
  index_type: hnsw
  url: null
  api_key: null
  grpc_port: 50051

vector_store_router:
  default: sqlite_vec_default:soothe_default

# ============================================================
# SECURITY & WORKSPACE
# ============================================================
# SecurityConfig — path evaluation: denied_paths → allowed_paths → workspace boundary.
# FilesystemMiddlewareConfig — backup on delete; sandboxing from security.allow_paths_outside_workspace.
# WorkspaceMountConfig — host_root + container_root for container deployments (RFC-621).

security:
  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true
  denied_paths:
  - /etc/**
  - /bin/**
  - /sbin/**
  - /usr/**
  - /System/**
  - /Library/**
  - /private/etc/**
  - ~/.ssh/**
  - ~/.gnupg/**
  - ~/.aws/**
  - "**/.env"
  - "**/credentials.json"
  - "**/secrets.json"
  allowed_paths:
  - "**"
  denied_file_types: []
  require_approval_for_file_types:
  - .env
  - .pem
  - .key
  - .p12
  - .pfx
  - .crt
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
filesystem_middleware:
  backup_enabled: true
  backup_dir: null
  workspace_root: null
  max_file_size_mb: 10
  tool_token_limit_before_evict: 20000
workspace_mount:
  host_root: null
  container_root: null

# ============================================================
# OBSERVABILITY & SCHEDULING
# ============================================================
# ObservabilityConfig — file/console logging, verbosity, Langfuse callbacks.
# CronConfig — natural-language scheduled jobs via Autopilot (RFC-229).

observability:
  log_file_level: INFO
  log_file_path: null
  log_file_max_bytes: 5242880
  log_file_backup_count: 3
  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: "%(level_short)s %(name)s %(message)s"
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  verbosity: normal
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  thread_logging_max_size_mb: 100
  profile_model_calls: false
  langfuse:
    enabled: false
    public_key: null
    secret_key: null
    host: null
    environment: null
    release: null
    sample_rate: null
    trace_name: null
    tags: null
    user_id: null
cron:
  max_jobs: 100
  poll_interval: 60
  extraction_model: fast
  extraction_timeout: 30
  default_priority: 50
  timezone: local

# ============================================================
# CLIENT & TUI
# ============================================================
# UIConfig theme, UpdateConfig PyPI check, LangGraph debug flag.

debug: false
activity_max_lines: 300
tui_debug: false
ui:
  theme: null
update:
  check: true
  auto_update: true

# ============================================================
# OPTIMIZATION
# ============================================================
# OptimizationConfig — failure intent classification and structured plan parsing (IG-433).

optimization:
  failure_intent:
    enabled: true
    llm_confidence_threshold: 0.7
  structured_plan:
    enabled: true
