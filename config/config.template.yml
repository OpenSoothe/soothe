# Soothe Configuration Template
# See packages/soothe/src/soothe/config/ for Pydantic defaults.
# Usage: soothe --config /path/to/this-file.yaml
# Secrets: use ${ENV_VAR} syntax; export OPENAI_API_KEY, TAVILY_API_KEY, etc.

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: openai
    provider_type: openai
    api_key: ${OPENAI_API_KEY}
    api_base_url: null
    models:
      - gpt-4o
      - gpt-4o-mini
      - o3-mini

    # OpenAI-compatible (DashScope, OpenRouter, vLLM):
    # - name: dashscope
    #   provider_type: openai
    #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: "${DASHSCOPE_API_KEY}"
    #   models: [qwen-max]

    # LMStudio / Ollama — use provider_type: limited_openai
    # - name: lmstudio
    #   provider_type: limited_openai
    #   api_base_url: http://localhost:1234/v1
    #   api_key: "lmstudio"
    #   models: [google/gemma-4-26b-a4b]

    # Anthropic:
    # - name: anthropic
    #   provider_type: anthropic
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   models: [claude-sonnet-4-20250514]

router:
  default: openai:gpt-4o-mini
  think: null
  fast: null
  image: null
  embedding: null

embedding_dims: 1536

# ============================================================
# AGENT
# ============================================================

agent:
  # --- Identity ---
  name: Soothe
  system_prompt: null
  workspace_instructions_max_chars: 8000

  # --- Core Agent Backend ---
  # langgraph (default): LangGraph with langchain ecosystem
  # claude: claude-agent-sdk (Claude Code CLI) for full tool capabilities
  core_agent_backend: langgraph
  claude_permission_mode: bypassPermissions
  claude_max_turns: 25
  claude_model: null

  # --- Autonomous (Self-Driving) ---
  # Controls 24/7 self-running behavior for goal-level and daemon-level.
  autonomous:
    enabled: false  # Enable scheduling loop for 24/7 autonomous operation
    max_iterations: 10
    max_retries: 2
    max_total_goals: 50
    max_goal_depth: 5
    max_parallel_goals: 3
    enable_dynamic_goals: true
    max_send_backs: 3
    checkpoint_interval: 10
    dreaming_enabled: true
    dreaming_consolidation_interval: 300
    dreaming_health_check_interval: 60
    verify_interval: 30  # Seconds between DAG verification cycles
    dreaming_interval: 300  # Seconds between time-based dreaming entries
    dreaming_scope: workspace  # loop | workspace | topic
    dreaming_modes:
      episodic:
        enabled: true
        max_episodes: 10
      procedure:
        enabled: true
        min_success_rate: 0.8
      semantic:
        enabled: true
      profile:
        enabled: true
    scheduler_enabled: true
    max_scheduled_tasks: 100
    webhooks: {}
    max_loops: 4  # Worker pool cap; loops reused for parent→child lineage
    loop_idle_timeout: 300
    poll_interval: 5
    dreaming_poll_interval: 60
    context_projection:  # Bounds for GoalDispatchContextBundle IPC
      max_findings: 20
      max_files: 50
      max_plan_steps: 30
      context_retention_hours: 168  # Evict after root goal terminal + 1 week
    workspace_reservation:  # Scheduling-time conflict gate for overlapping workspaces
      enabled: true
      strict_overlap: true

  # --- Cron Service ---
  # Natural language scheduled job submission and execution via /cron commands.
  cron:
    enabled: true
    max_jobs: 100
    poll_interval: 60
    extraction_model: fast  # fast | think
    extraction_timeout: 30
    default_priority: 50

  # --- Loop (StrangeLoop Internal Tuning) ---
  # Defaults optimized for most use cases; rarely edited.
  loop:
    enabled: true
    max_iterations: 99
    max_subagent_tasks_per_wave: 4
    strange_loop_output_contract_enabled: true  # Suppress full tool output re-paste
    prior_conversation_limit: 10
    context_window_limit: 200000
    goal_completion_mode: llm_only  # llm_only | heuristic_only | hybrid
    final_response: adaptive  # adaptive | always_synthesize
    context_overflow_threshold_pct: 0.80  # Trigger compaction at 80% (160k tokens)
    context_compaction_target_pct: 0.60  # Compact to 60% (120k tokens)
    step_context_check_enabled: false  # Step threads usually short-lived
    loop_orchestrator_evidence_validate: true  # Plan evidence validation node
    output_streaming:
      mode: adaptive  # batch | adaptive | streaming
      streaming_interval_ms: 300
      adaptive_threshold_chars: 500
      adaptive_block_chars: 500
      adaptive_block_interval_ms: 250
      file_output_threshold_chars: 0  # 0 = never write goal_completion to file
      file_output_preview_chars: 500
      file_output_dir: null  # null = <workspace>/.soothe/output
      message_coalesce_enabled: true
      tool_batch_enabled: true
      tool_batch_interval_ms: 200
      suppress_redundant_stream_tool_updates: true
      skip_redundant_tool_message_wire: false
      tui_flush_interval_ms: 200
    working_memory:
      enabled: true
      max_inline_chars: 4000
      max_entry_chars_before_spill: 1500
    goal_context:
      plan_limit: 10
      execute_limit: 10
      enabled: true
    report_output:
      display_threshold: 20000
      preview_chars: 500
      synthesis_max_chars: 0
    plan_prompt_ledger:  # 0 = unlimited (full passthrough)
      plan_ledger_max_messages: 0
      plan_ledger_max_total_chars: 0
      plan_ledger_max_message_chars: 0
    context_engine:  # Projection limits for prompt template context injection
      projection_max_goals: 5
      projection_max_steps_per_goal: 10
      projection_max_ledger_chars: 4000
      projection_max_ledger_messages: 20
      projection_max_lineage_chars: 2000
      projection_max_project_instructions_chars: 8000
    checkpoint:
      progressive: true
      auto_resume_on_start: false
    concurrency:
      max_parallel_goals: 4
      max_parallel_steps: 4
      max_parallel_subagents: 4
      max_parallel_tools: 50
      global_max_llm_calls: 10
      step_parallelism: dependency
      # RFC-803 Phase 6: Async checkpoint writes
      checkpoint:
        async_write: true        # Enable fire-and-forget writes (non-blocking)
        flush_interval: 5.0       # Periodic forced write interval (seconds)
        queue_size: 100           # Max queued checkpoints before blocking

    # LLM rate limiting (moderate defaults for Dashscope/Zhipu)
    llm_rate_limit:
      enabled: true
      rpm_limit: 60
      concurrent_limit: 8
      call_timeout_seconds: 600
      call_timeout_max_seconds: 900
      retry_on_timeout: true
      max_timeout_retries: 10
      timeout_retry_multiplier: 1.2
      retry_on_rate_limit: true
      max_rate_limit_retries: 10
      rate_limit_backoff_base: 2.0
      rate_limit_backoff_max: 60.0
      respect_retry_after_header: true

    tool_output:
      code_exec_max_output_chars: 32000
      tool_output_max_chars: 10000

    tool_call_limit:
      global_thread_limit: 200
      global_run_limit: 200
      tool_specific_limits:
        wizsearch_search:
          thread_limit: 5
          run_limit: 3
        wizsearch_crawl:
          thread_limit: 5
          run_limit: 3
        web_search:
          thread_limit: 5
          run_limit: 3
        fetch_url:
          thread_limit: 5
          run_limit: 3
        search:
          thread_limit: 5
          run_limit: 3

    tool_retry:
      max_retries: 3
      backoff_factor: 2.0
      initial_delay: 1.0

    # Tool timeout middleware (prevent indefinite hangs)
    tool_timeout:
      enabled: true
      default_seconds: 60.0
      per_tool:
        grep: 30.0
        glob: 20.0
        read_file: 30.0
        explore: 1800.0  # Subagent exploration (30 minutes)
        browser_use: 1800.0  # Browser automation (30 minutes)
        task: 86400.0  # Task tool for autonomous subagent work (24 hours)
      skip_tools_with_internal_timeout: true

  # --- Protocols ---
  protocols:
    memory:
      enabled: true
      persist_dir: null
      llm_chat_role: fast
      llm_embed_role: embedding
      enable_embeddings: true
      enable_auto_categorization: true
      enable_category_summaries: true
      memory_categories:
        - name: personal_info
          description: Personal information
        - name: preferences
          description: User preferences and interests
        - name: knowledge
          description: Facts and learned information
        - name: experiences
          description: Past experiences and events
        - name: goals
          description: Goals and objectives
    planner:
      model: think  # think for complex reasoning, fast for speed
      routing: auto
    policy:
      profile: standard
    durability:
      backend: default
      checkpointer: default
      persist_dir: null
      thread_inactivity_timeout_hours: 72

  # --- Code Interpreter ---
  # Embedded QuickJS interpreter for programmatic tool calling (PTC).
  # Opt-in; when enabled, agents can call tools via tools.* namespace.
  code_interpreter:
    enabled: false
    ptc_allowlist: []  # Tools exposed via tools.* namespace

  # --- Runtime Performance ---
  runtime:
    lazy_core_agent: true
    memory_limit_mb: 128
    timeout_seconds: 30
    max_ptc_calls: 50
    max_result_size: 100000
    console_capture: true
    snapshot_between_turns: false

  # --- Clarification Relay ---
  # Manual mode: TUI relay; auto mode: veritas subagent.
  # Triggers on structured `ask_user` interrupts only.
  clarification:
    auto_policy: veritas
    auto_min_confidence: 0.4
    max_defer_age_hours: 168
    default_mode: auto  # auto = veritas; manual = TUI relay

  # --- Veritas (Clarification auto-answerer) ---
  veritas:
    model_role: think
    max_context_steps: 8

# ============================================================
# TOOLS
# ============================================================
tools:
  execution:
    enabled: true
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
      - tavily
    max_results_per_engine: 10
    timeout: 30
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    headers: {}
    verify_ssl: true
  # DeepXIV: Academic paper search (opt-in). Set DEEPXIV_API_KEY or token below.
  deepxiv:
    enabled: false
    token: null
    timeout: 60
    max_retries: 3

# ============================================================
# SUBAGENTS
# ============================================================
subagents:
  explore:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      thoroughness: medium
      max_iterations:
        quick: 6
        medium: 10
        thorough: 16
      max_read_lines: 50
      max_matches_returned: 5
      max_history_messages_for_model: 8
      max_tool_output_chars_per_turn: 2000
      early_stop_no_new_findings_turns: 2
      max_findings_for_synthesis: 20
      enable_semantic_similarity: true
      semantic_similarity_timeout_seconds: 10
      synthesis_timeout_seconds: 120
  plan:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}
  tacitus:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      llm_role: fast
      synthesis_role: fast # set to ``think`` for higher-quality synthesis at higher latency
      effort: normal
  browser_use:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}

# ============================================================
# MCP SERVERS, PLUGINS, SKILLS
# ============================================================
# Supports: stdio, sse, streamable_http, websocket transports.
# Example:
#   mcp_servers:
#     - name: filesystem
#       transport: stdio
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#       defer: true
mcp_servers: []
progressive_mcp:
  budget_pct: 0.01  # Fraction of context_window_limit for tool listing
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20

plugins: []
skills: []
progressive_skills:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
progressive_tools:
  enabled: true  # Bind core tools only; list deferred in prompt
  budget_pct: 0.01
  max_listing_chars_per_entry: 120
  min_listing_chars_per_entry: 20
  search_tools_enabled: true
memory: []

# ============================================================
# UI & OBSERVABILITY
# ============================================================
debug: false
activity_max_lines: 300
tui_debug: false
ui:
  theme: null

observability:
  log_file_level: INFO
  log_file_path: null
  log_file_max_bytes: 5242880
  log_file_backup_count: 3
  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: "%(level_short)s %(name)s %(message)s"
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  verbosity: normal
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  thread_logging_max_size_mb: 100
  profile_model_calls: false
  langfuse:
    enabled: false
    public_key: null
    secret_key: null
    host: null
    environment: null
    release: null
    sample_rate: null
    trace_name: null
    tags: null
    user_id: null

update:
  check: true
  auto_update: true

# ============================================================
# PERSISTENCE
# ============================================================
# SQLite (default) or PostgreSQL for production with high concurrency.
persistence:
  default_backend: sqlite
  metadata_sqlite_path: null  # $SOOTHE_DATA_DIR/metadata.db
  checkpoint_sqlite_path: null  # $SOOTHE_DATA_DIR/soothe_checkpoints.db
  sqlite_reader_pool_size: 8
  postgres_base_dsn: null  # e.g., "postgresql://user:pass@host:port"
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory
  soothe_postgres_dsn: postgresql://postgres:postgres@localhost:5432/soothe
  postgres_pool_min_size: 4
  checkpointer_pool_size: 24
  sloop_pool_size: 24
  postgres_pool_max_idle_seconds: 120
  postgres_pool_max_lifetime_seconds: 1800
  postgres_pool_acquire_timeout_seconds: 30
  archive_enabled: true
  archive_retention_days: 90
  archive_max_count: 1000

# ============================================================
# VECTOR STORES
# ============================================================
# sqlite_vec uses sqlite-vec extension for vector search (default).
vector_stores:
  - name: sqlite_vec_default
    provider_type: sqlite_vec

vector_store_router:
  default: sqlite_vec_default:soothe_default

# ============================================================
# SECURITY
# ============================================================
security:
  sandbox: false
  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true
  denied_paths:
    - /etc/**
    - /bin/**
    - /sbin/**
    - /usr/**
    - /System/**
    - /Library/**
    - /private/etc/**
    - ~/.ssh/**
    - ~/.gnupg/**
    - ~/.aws/**
    - "**/.env"
    - "**/credentials.json"
    - "**/secrets.json"
  allowed_paths:
    - "**"
  denied_file_types: []
  require_approval_for_file_types:
    - .env
    - .pem
    - .key
    - .p12
    - .pfx
    - .crt
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []

filesystem_middleware:
  backup_enabled: true
  backup_dir: null
  workspace_root: null
  max_file_size_mb: 10
  tool_token_limit_before_evict: 20000

# ============================================================
# OPTIMIZATION
# ============================================================
# LLM-based semantic heuristics with fallback to legacy when LLM unavailable.
optimization:
  semantic_risk:
    enabled: true
    cache_enabled: true
    cache_similarity_threshold: 0.9
    confidence_threshold: 0.5
  semantic_relationships:
    enabled: true
    auto_apply_threshold: 0.85
    flag_threshold: 0.70
  failure_intent:
    enabled: true
    llm_confidence_threshold: 0.7
  structured_plan:
    enabled: false
  tool_result_registry:
    enabled: true

# ============================================================
# WORKSPACE
# ============================================================
# Daemon fallback: temp directory (override with SOOTHE_WORKSPACE).
# Persisted sandboxes: $SOOTHE_HOME/workspaces/<user>/ws_<hash>/
# Container deployment: set both mount fields to translate client→container paths.
workspace_mount:
  host_root: null  # e.g. /var/run/soothe/workspaces
  container_root: null  # e.g. /workspaces
