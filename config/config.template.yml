# Soothe Configuration Template
# ------------------------------------------------------------------------------
# Full YAML aligned with Pydantic defaults in ``packages/soothe/src/soothe/config/``
# (``models.py``, ``daemon_config.py``, ``settings.py``). Values match those defaults
# except documented examples: OpenAI ``providers`` sample, ``sqlite_vec`` store + router,
# and explicit ``subagents.*.config`` blocks (``ExploreSubagentConfig`` / ``PlanSubagentConfig``
# defaults; optional router roles are null and inherit ``default``).
#
# Usage: soothe --config /path/to/this-file.yaml
# Local dev: start from config/config.dev.yml and adjust providers.
# Secrets: use ``${ENV_VAR}`` under providers; export OPENAI_API_KEY, etc.
# Optional tool env: TAVILY_API_KEY, JINA_API_KEY, SERPER_API_KEY, GITHUB_TOKEN.

providers:
- name: openai
  provider_type: openai
  api_key: ${OPENAI_API_KEY}
  api_base_url: null
  models:
  - gpt-4o
  - gpt-4o-mini
  - o3-mini

  # OpenAI-compatible (DashScope, OpenRouter, vLLM):
  # - name: dashscope
  #   provider_type: openai
  #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   models: [qwen-max]

  # LMStudio / Ollama — use provider_type: limited_openai
  # - name: lmstudio
  #   provider_type: limited_openai
  #   api_base_url: http://localhost:1234/v1
  #   api_key: "lmstudio"
  #   models: [google/gemma-4-26b-a4b]

  # Anthropic:
  # - name: anthropic
  #   provider_type: anthropic
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   models: [claude-sonnet-4-20250514]

router:
  default: openai:gpt-4o-mini
  think: null
  fast: null
  image: null
  embedding: null
embedding_dims: 1536
assistant_name: Soothe
system_prompt: null
subagents:
  explore:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      thoroughness: medium
      max_iterations:
        quick: 6
        medium: 10
        thorough: 16
      max_read_lines: 50
      max_matches_returned: 5
      max_history_messages_for_model: 8
      max_tool_output_chars_per_turn: 2000
      early_stop_no_new_findings_turns: 2
      max_findings_for_synthesis: 20
      enable_semantic_similarity: true
      semantic_similarity_timeout_seconds: 10
      synthesis_timeout_seconds: 120
      tool_call_limit_thread: null
      tool_call_limit_run: null
    runtime_dir: ''
  plan:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}
    runtime_dir: ''
  tacitus:
    enabled: true
    model: null  # null → router.fast (see router.fast)
    transport: local
    url: null
    config:
      llm_role: fast
      synthesis_role: think  # set fast for lower-latency final report
    runtime_dir: ''
tools:
  execution:
    enabled: true
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
    - tavily
    max_results_per_engine: 10
    timeout: 30
  image:
    enabled: true
  audio:
    enabled: true
  video:
    enabled: true
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    headers: {}
    verify_ssl: true
  # DeepXiv: Academic paper search and progressive reading (enabled by default)
  # Token: set DEEPXIV_API_KEY or DEEPXIV_TOKEN, or override token below
  # Register at https://data.rag.ac.cn (10,000 req/day); omit token for anonymous tier
  deepxiv:
    enabled: true
    token: null
    timeout: 60
    max_retries: 3
mcp_servers: []
plugins: []
skills: []
memory: []
debug: false
activity_max_lines: 300
tui_debug: false
ui:
  theme: null
update:
  check: true
  auto_update: true
persistence:
  postgres_base_dsn: null
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory
  soothe_postgres_dsn: postgresql://postgres:postgres@localhost:5432/soothe
  default_backend: sqlite
  # PostgreSQL pool sizing depends on runner mode (daemon_config.yml):
  # - worker_pool: Each subprocess has own pool (N workers × pool_size). Use small values (2-4).
  # - thread_pool: Daemon-level singleton shared by all threads. Can use larger values (8-12).
  checkpointer_pool_size: 2      # Small default for worker_pool mode
  agentloop_pool_size: 4         # Small default for worker_pool mode
  metadata_sqlite_path: null
  checkpoint_sqlite_path: null
protocols:
  memory:
    enabled: true
    persist_dir: null
    llm_chat_role: fast
    llm_embed_role: embedding
    enable_embeddings: true
    enable_auto_categorization: true
    enable_category_summaries: true
    memory_categories:
    - name: personal_info
      description: Personal information
    - name: preferences
      description: User preferences and interests
    - name: knowledge
      description: Facts and learned information
    - name: experiences
      description: Past experiences and events
    - name: goals
      description: Goals and objectives
  planner:
    model: think
    use_fast_model: true
    routing: auto
    planner_model: think
  policy:
    profile: standard
  durability:
    backend: default
    checkpointer: default
    persist_dir: null
    thread_inactivity_timeout_hours: 72
autonomous:
  enabled_by_default: false
  max_iterations: 10
  max_retries: 2
  max_total_goals: 50
  max_goal_depth: 5
  enable_dynamic_goals: true
agent_loop:
  enabled: true
  max_iterations: 10
  max_subagent_tasks_per_wave: 4
  agent_loop_output_contract_enabled: true
  final_response: adaptive
  goal_completion_mode: llm_only
  prior_conversation_limit: 10
  context_window_limit: 200000
  # Output streaming configuration (RFC-614)
  output_streaming:
    mode: adaptive                    # batch | adaptive (stream small, batch large)
    streaming_interval_ms: 200        # Daemon WebSocket batching interval
    message_coalesce_enabled: true    # Coalesce plain assistant text chunks before broadcast
    tui_flush_interval_ms: 200        # TUI rendering flush interval
    adaptive_threshold_chars: 500     # Adaptive switch threshold (chars)
    file_output_threshold_chars: 5000 # Write goal_completion to file when larger (0 = never)
    file_output_preview_chars: 500    # Preview chars in TUI when saved to file
    file_output_dir: null             # Default: current workspace root/.soothe/output
  loop_orchestrator_evidence_validate: true
  planning:
    simple_max_tokens: 50
    complexity_threshold: 160
    force_keywords:
    - plan for
    - create a plan
    - steps to
    adaptive_escalation: true
  early_termination:
    enabled: true
    completion_signals:
    - task complete
    - done
    - finished successfully
    error_threshold: 3
  working_memory:
    enabled: true
    max_inline_chars: 4000
    max_entry_chars_before_spill: 1500
  goal_context:
    plan_limit: 10
    execute_limit: 10
    enabled: true
  report_output:
    display_threshold: 20000
    preview_chars: 500
    synthesis_max_chars: 0
  plan_prompt_ledger:
    plan_ledger_max_messages: 0
    plan_ledger_max_total_chars: 0
    plan_ledger_max_message_chars: 0
  limits:
    max_parallel_goals: 1
    max_parallel_steps: 2
    max_parallel_subagents: 4
    global_max_llm_calls: 5
    step_parallelism: dependency
    max_parallel_tools: 5
    llm_rpm_limit: 120
    llm_concurrent_limit: 10
    llm_call_timeout_seconds: 120
    llm_call_timeout_adaptive: true
    llm_call_timeout_max_seconds: 120
    llm_retry_on_timeout: true
    llm_max_timeout_retries: 2
    llm_timeout_retry_multiplier: 2.0
    recovery:
      progressive_checkpoints: true
      auto_resume_on_start: false
    tool_call_limit:
      global_thread_limit: 150
      global_run_limit: 56
      tool_specific_limits:
        wizsearch_search:
          thread_limit: 5
          run_limit: 3
        wizsearch_crawl:
          thread_limit: 5
          run_limit: 3
        web_search:
          thread_limit: 5
          run_limit: 3
        fetch_url:
          thread_limit: 5
          run_limit: 3
        search:
          thread_limit: 5
          run_limit: 3
    tool_retry:
      max_retries: 3
      backoff_factor: 2.0
      initial_delay: 1.0
observability:
  log_file_level: INFO
  log_file_path: null
  log_file_max_bytes: 5242880
  log_file_backup_count: 3
  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: '%(level_short)s %(name)s %(message)s'
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  verbosity: normal
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  thread_logging_max_size_mb: 100
  langfuse:
    enabled: false
    public_key: null
    secret_key: null
    host: null
    environment: null
    release: null
    sample_rate: null
    trace_name: null
    tags: null
    user_id: null
security:
  # Enable sandboxed execution via SandboxBackendProtocol. When true, the
  # deepagents `execute` tool (sandbox-backed) is available. Host-execution
  # tools (run_command, run_python, run_background) are always available.
  sandbox: false
  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true
  denied_paths:
  - /etc/**
  - /bin/**
  - /sbin/**
  - /usr/**
  - /System/**
  - /Library/**
  - /private/etc/**
  - ~/.ssh/**
  - ~/.gnupg/**
  - ~/.aws/**
  - '**/.env'
  - '**/credentials.json'
  - '**/secrets.json'
  allowed_paths:
  - '**'
  denied_file_types: []
  require_approval_for_file_types:
  - .env
  - .pem
  - .key
  - .p12
  - .pfx
  - .crt
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
filesystem_middleware:
  backup_enabled: true
  backup_dir: null
  workspace_root: null
  virtual_mode: false
  max_file_size_mb: 10
  tool_token_limit_before_evict: 20000
# Code interpreter configuration (IG-423): Embedded QuickJS for programmatic tool calling
# Reference: https://www.langchain.com/blog/give-your-agents-an-interpreter
code_interpreter:
  enabled: true
  ptc_allowlist: []
  memory_limit_mb: 128
  timeout_seconds: 30
  max_ptc_calls: 50
  max_result_size: 10000
  console_capture: true
  snapshot_between_turns: false
# Daemon-side configuration (transports, worker pool, distributed) lives in
# `daemon_config.yml` and is parsed by `SootheDaemonConfig`. See
# `config/daemon_config.template.yml` for the full reference.
autopilot:
  max_iterations: 50
  max_send_backs: 3
  max_parallel_goals: 3
  dreaming_enabled: true
  dreaming_consolidation_interval: 300
  dreaming_health_check_interval: 60
  checkpoint_interval: 10
  scheduler_enabled: true
  max_scheduled_tasks: 100
  webhooks: {}

# Default example: sqlite_vec (empty list is the code default; this block is illustrative).
# PostgreSQL + pgvector alternative:
# vector_stores:
#   - name: pgvector_default
#     provider_type: pgvector
#     dsn: "postgresql://postgres:postgres@localhost:5432/soothe_vectors"
#     pool_size: 5
#     index_type: hnsw
# vector_store_router:
#   default: "pgvector_default:soothe_default"

vector_stores:
- name: sqlite_vec_default
  provider_type: sqlite_vec
vector_store_router:
  default: sqlite_vec_default:soothe_default

# Workspace configuration
# ====================
# Daemon fallback workspace defaults to a temp directory (override with SOOTHE_WORKSPACE).
# When loop_new sets client_workspace (RPC field: workspace), the runner uses that path directly.
# When client_workspace is unset, persisted sandboxes live under:
#   $SOOTHE_HOME/workspaces/<user>/ws_<hash>/
#   - Empty user_id → directory segment "anonymous"; hash uses "" as the user part.
#   - hash = SHA256(user_id, client_workspace_id or loop_id)[:16]
# The anonymous workspace tree is removed on daemon shutdown.
#
# loop_new RPC fields: client_workspace (or legacy workspace), user_id, client_workspace_id.
