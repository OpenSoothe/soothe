# Soothe — minimal configuration template
#
# Defaults live in packages/soothe/src/soothe/config/models.py (Pydantic).
# Zero-config: export OPENAI_API_KEY=... and run — no config file required.
#
# Usage: soothe --config /path/to/this-file.yaml
# Secrets: ${ENV_VAR} syntax; export OPENAI_API_KEY, TAVILY_API_KEY, etc.

providers:
  - name: openai
    provider_type: openai
    api_key: ${OPENAI_API_KEY}
    api_base_url: null
    models:
      - gpt-4o
      - gpt-4o-mini
      - o3-mini

    # OpenAI-compatible (DashScope, OpenRouter, vLLM, LMStudio):
    # - name: dashscope
    #   provider_type: openai
    #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: "${DASHSCOPE_API_KEY}"
    #   models: [qwen-max]

    # Anthropic:
    # - name: anthropic
    #   provider_type: anthropic
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   models: [claude-sonnet-4-20250514]

router_profiles:
  - name: default
    router:
      default: openai:gpt-4o-mini
      think: null
      fast: null
      image: null
      ocr: null
      embedding: null
    embedding_dims: 1536

active_router_profile: default

