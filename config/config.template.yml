# Soothe Configuration Template
# ------------------------------------------------------------------------------
# Full YAML aligned with Pydantic defaults in ``packages/soothe/src/soothe/config/``
# (``models.py``, ``daemon_config.py``, ``settings.py``). Values match those defaults
# except documented examples: OpenAI ``providers`` sample, ``sqlite_vec`` store + router,
# and explicit ``subagents.*.config`` blocks (same as ``BrowserSubagentConfig`` /
# ``ExploreSubagentConfig`` defaults; optional router roles are null and inherit ``default``).
#
# Usage: soothe --config /path/to/this-file.yaml
# Local dev: start from config/config.dev.yml and adjust providers.
# Secrets: use ``${ENV_VAR}`` under providers; export OPENAI_API_KEY, etc.
# Optional tool env: TAVILY_API_KEY, JINA_API_KEY, SERPER_API_KEY, GITHUB_TOKEN.

providers:
- name: openai
  provider_type: openai
  api_key: ${OPENAI_API_KEY}
  api_base_url: null
  models:
  - gpt-4o
  - gpt-4o-mini
  - o3-mini

  # OpenAI-compatible (DashScope, OpenRouter, vLLM):
  # - name: dashscope
  #   provider_type: openai
  #   api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   models: [qwen-max]

  # LMStudio / Ollama — use provider_type: limited_openai
  # - name: lmstudio
  #   provider_type: limited_openai
  #   api_base_url: http://localhost:1234/v1
  #   api_key: "lmstudio"
  #   models: [google/gemma-4-26b-a4b]

  # Anthropic:
  # - name: anthropic
  #   provider_type: anthropic
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   models: [claude-sonnet-4-20250514]

router:
  default: openai:gpt-4o-mini
  think: null
  fast: null
  image: null
  embedding: null
embedding_dims: 1536
assistant_name: Soothe
system_prompt: null
subagents:
  browser:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      max_steps: 10
      runtime_dir: ''
      downloads_dir: ''
      user_data_dir: ''
      extensions_dir: ''
      cleanup_on_exit: true
      disable_extensions: true
      disable_cloud: true
      disable_telemetry: true
      enable_existing_browser: true
      browser_start_timeout: 90
      profile_mode: ephemeral
    runtime_dir: ''
  claude:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}
    runtime_dir: ''
  explore:
    enabled: true
    model: null
    transport: local
    url: null
    config:
      thoroughness: medium
      max_iterations:
        quick: 12
        medium: 24
        thorough: 48
      max_read_lines: 50
      max_matches_returned: 5
      max_history_messages_for_model: 8
      max_tool_output_chars_per_turn: 2000
      early_stop_no_new_findings_turns: 2
      max_findings_for_synthesis: 20
      enable_semantic_similarity: true
      tool_call_limit_thread: null
      tool_call_limit_run: null
    runtime_dir: ''
  research:
    enabled: true
    model: null
    transport: local
    url: null
    config: {}
    runtime_dir: ''
tools:
  execution:
    enabled: true
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
    - tavily
    max_results_per_engine: 10
    timeout: 30
  image:
    enabled: true
  audio:
    enabled: true
  video:
    enabled: true
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    headers: {}
    verify_ssl: true
mcp_servers: []
plugins: []
skills: []
memory: []
debug: false
activity_max_lines: 300
tui_debug: false
ui:
  theme: null
update:
  auto_update: false
persistence:
  postgres_base_dsn: null
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory
  soothe_postgres_dsn: postgresql://postgres:postgres@localhost:5432/soothe
  default_backend: sqlite
  checkpointer_pool_size: 8
  agentloop_pool_size: 12
  metadata_sqlite_path: null
  checkpoint_sqlite_path: null
protocols:
  memory:
    enabled: true
    persist_dir: null
    llm_chat_role: fast
    llm_embed_role: embedding
    enable_embeddings: true
    enable_auto_categorization: true
    enable_category_summaries: true
    memory_categories:
    - name: personal_info
      description: Personal information
    - name: preferences
      description: User preferences and interests
    - name: knowledge
      description: Facts and learned information
    - name: experiences
      description: Past experiences and events
    - name: goals
      description: Goals and objectives
  planner:
    model: think
    use_fast_model: true
    routing: auto
    planner_model: think
  policy:
    profile: standard
  durability:
    backend: default
    checkpointer: default
    persist_dir: null
    thread_inactivity_timeout_hours: 72
autonomous:
  enabled_by_default: false
  max_iterations: 10
  max_retries: 2
  max_total_goals: 50
  max_goal_depth: 5
  enable_dynamic_goals: true
agent_loop:
  enabled: true
  max_iterations: 10
  max_subagent_tasks_per_wave: 16
  agent_loop_output_contract_enabled: true
  final_response: adaptive
  goal_completion_mode: llm_only
  prior_conversation_limit: 10
  context_window_limit: 200000
  output_streaming: true
  loop_orchestrator_evidence_validate: true
  planning:
    simple_max_tokens: 50
    medium_max_steps: 3
    complexity_threshold: 160
    force_keywords:
    - plan for
    - create a plan
    - steps to
    adaptive_escalation: true
  early_termination:
    enabled: true
    completion_signals:
    - task complete
    - done
    - finished successfully
    error_threshold: 3
  working_memory:
    enabled: true
    max_inline_chars: 4000
    max_entry_chars_before_spill: 1500
  goal_context:
    plan_limit: 10
    execute_limit: 10
    enabled: true
  report_output:
    display_threshold: 20000
    preview_chars: 500
    synthesis_max_chars: 0
  plan_prompt_ledger:
    plan_ledger_max_messages: 0
    plan_ledger_max_total_chars: 0
    plan_ledger_max_message_chars: 0
  limits:
    max_parallel_goals: 1
    max_parallel_steps: 2
    max_parallel_subagents: 4
    global_max_llm_calls: 5
    step_parallelism: dependency
    max_parallel_tools: 5
    llm_rpm_limit: 120
    llm_concurrent_limit: 10
    llm_call_timeout_seconds: 120
    llm_call_timeout_adaptive: true
    llm_call_timeout_max_seconds: 900
    llm_retry_on_timeout: true
    llm_max_timeout_retries: 2
    llm_timeout_retry_multiplier: 2.0
    recovery:
      progressive_checkpoints: true
      auto_resume_on_start: false
    tool_call_limit:
      global_thread_limit: 150
      global_run_limit: 56
      tool_specific_limits:
        wizsearch_search:
          thread_limit: 5
          run_limit: 3
        wizsearch_crawl:
          thread_limit: 5
          run_limit: 3
        web_search:
          thread_limit: 5
          run_limit: 3
        fetch_url:
          thread_limit: 5
          run_limit: 3
        search:
          thread_limit: 5
          run_limit: 3
    tool_retry:
      max_retries: 3
      backoff_factor: 2.0
      initial_delay: 1.0
observability:
  log_file_level: INFO
  log_file_path: null
  log_file_max_bytes: 5242880
  log_file_backup_count: 3
  console:
    enabled: false
    level: WARNING
    stream: stderr
    format: '%(level_short)s %(name)s %(message)s'
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  verbosity: normal
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  thread_logging_max_size_mb: 100
  langfuse:
    enabled: false
    public_key: null
    secret_key: null
    host: null
    environment: null
    release: null
    sample_rate: null
    trace_name: null
    tags: null
    user_id: null
security:
  sandbox: false
  allow_paths_outside_workspace: false
  require_approval_for_outside_paths: true
  denied_paths:
  - /etc/**
  - /bin/**
  - /sbin/**
  - /usr/**
  - /System/**
  - /Library/**
  - /private/etc/**
  - ~/.ssh/**
  - ~/.gnupg/**
  - ~/.aws/**
  - '**/.env'
  - '**/credentials.json'
  - '**/secrets.json'
  allowed_paths:
  - '**'
  denied_file_types: []
  require_approval_for_file_types:
  - .env
  - .pem
  - .key
  - .p12
  - .pfx
  - .crt
  whitelist_paths_bypass: []
  whitelist_commands_bypass: []
hitl:
  enabled: false
  tools: []
filesystem_middleware:
  backup_enabled: true
  backup_dir: null
  workspace_root: null
  virtual_mode: false
  max_file_size_mb: 10
  tool_token_limit_before_evict: 20000
daemon:
  transports:
    websocket:
      enabled: true
      host: 127.0.0.1
      port: 8765
      tls_enabled: false
      tls_cert: null
      tls_key: null
      cors_origins:
      - http://localhost:*
      - http://127.0.0.1:*
      max_frame_size: 10485760
    http_rest:
      enabled: false
      host: 127.0.0.1
      port: 8766
      tls_enabled: false
      tls_cert: null
      tls_key: null
      cors_origins:
      - http://localhost:*
      - http://127.0.0.1:*
  max_concurrent_threads: 100
  max_query_duration_minutes: 60
  cancel_grace_seconds: 30
  hitl_timeout_seconds: 30
  query_timeout_action: cancel
  thread_max_age_hours: 24
  auto_cancel_on_startup: true
  max_input_queue_size: 1000
  max_concurrent_dispatches: 50
  event_size_stats_enabled: false
  event_size_stats_interval_seconds: 60
  event_size_stats_idle_pause_seconds: 120
  distributed:
    enabled: false
    ray:
      address: null
      num_cpus: 0.0
      object_store_memory: 0
      max_concurrent_actors: 10
      actor_lifetime: detached
      log_to_driver: true
  worker_pool:
    enabled: true
    min_pool_size: 2
    max_pool_size: 4
    idle_timeout_seconds: 300
    max_requests_per_worker: 100
    request_timeout_seconds: 1800
    heartbeat_interval_seconds: 30
    stuck_worker_timeout_seconds: 180
    dispatch_wait_stats_enabled: false
    dispatch_wait_stats_interval_seconds: 60
    dispatch_wait_stats_idle_pause_seconds: 120
autopilot:
  max_iterations: 50
  max_send_backs: 3
  max_parallel_goals: 3
  dreaming_enabled: true
  dreaming_consolidation_interval: 300
  dreaming_health_check_interval: 60
  checkpoint_interval: 10
  scheduler_enabled: true
  max_scheduled_tasks: 100
  webhooks: {}

# Default example: sqlite_vec (empty list is the code default; this block is illustrative).
# PostgreSQL + pgvector alternative:
# vector_stores:
#   - name: pgvector_default
#     provider_type: pgvector
#     dsn: "postgresql://postgres:postgres@localhost:5432/soothe_vectors"
#     pool_size: 5
#     index_type: hnsw
# vector_store_router:
#   default: "pgvector_default:soothe_default"

vector_stores:
- name: sqlite_vec_default
  provider_type: sqlite_vec
vector_store_router:
  default: sqlite_vec_default:soothe_default

# workspace_dir defaults to $SOOTHE_HOME/Workspace — override if needed:
# workspace_dir: "/path/to/your/project"
