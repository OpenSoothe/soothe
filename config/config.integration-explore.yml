# Explore-focused integration/CI profile: PostgreSQL + Langfuse (same stack as dev).
# Turns off browser_use subagent so runs focus on explore.
#
#   SOOTHE_INTEGRATION_BASE_CONFIG=/abs/path/config.integration-explore.yml pytest ... --run-integration
#
# Docker: Postgres with pgvector on host port 6432; Langfuse UI at http://localhost:3300
# (see repo docker-compose.yml). Export DASHSCOPE_* and optional TAVILY_API_KEY as for dev.

providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - qwen-max
      - qwen3.5-flash
      - qwen3.5-plus
      - MiniMax-M2.5
      - kimi-k2.5
      - multimodal-embedding-v1

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.5-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - deepseek-v3.2

  - name: mlxserver
    provider_type: limited_openai
    api_base_url: "http://100.75.70.86:9271/v1"
    api_key: "fakeapikey"
    models:
      - glm-4.7-flash
      - glm-4.6v-flash
      - nomic-embed

router:
  default: "coding-plan:glm-5"
  fast: "coding-plan:kimi-k2.5"
  think: "coding-plan:glm-5"
  image: "coding-plan:qwen3.5-plus"
  embedding: "dashscope:multimodal-embedding-v1"

agent:
  loop:
    max_iterations: 99
    max_subagent_tasks_per_wave: 4
    plan_prompt_ledger:
      plan_ledger_max_messages: 40
      plan_ledger_max_total_chars: 60000
      plan_ledger_max_message_chars: 8000
    limits:
      max_parallel_steps: 4
      max_parallel_tools: 10
      global_max_llm_calls: 10
      llm_call_timeout_max_seconds: 240
      tool_call_limit:
        global_thread_limit: 220
        global_run_limit: 80

observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# Daemon-side configuration lives in `config/daemon_config.template.yml`
# (loaded by `SootheDaemonConfig` from `~/.soothe/config/daemon_config.yml`).

subagents:
  tacitus:
    enabled: false
  explore:
    enabled: true
    config:
      semantic_similarity_timeout_seconds: 10
      max_iterations:
        quick: 6
        medium: 10
        thorough: 16

persistence:
  default_backend: postgresql
  agentloop_pool_size: 10
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"

vector_stores:
  - name: pgvector_dev
    provider_type: pgvector
    dsn: "postgresql://postgres:postgres@127.0.0.1:6432/soothe_vectors"
    pool_size: 4

vector_store_router:
  default: pgvector_dev:soothe_default
