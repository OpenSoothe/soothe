# Local development defaults (DashScope / coding-plan routers, Langfuse).
# Unlisted keys use Soothe Pydantic defaults. Full reference: config/config.template.yml.
#
# Persistence: SQLite by default (no external database required).
# Langfuse (optional): docker compose --profile langfuse up -d  → UI on :3300
# Keys: pk-lf-soothe-local / sk-lf-soothe-local (see docker-compose LANGFUSE_INIT_*). Export DASHSCOPE_*.

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - multimodal-embedding-v1

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.7-plus
      - qwen3.6-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - deepseek-v3.2

  - name: mlxserver
    provider_type: limited_openai
    api_base_url: "http://100.75.70.86:9271/v1"
    api_key: "fakeapikey"
    models:
      - glm-4.7-flash
      - glm-4.6v-flash
      - nomic-embed

router:
  default: "coding-plan:glm-5"
  fast: "coding-plan:kimi-k2.5"
  think: "coding-plan:glm-5"
  image: "coding-plan:kimi-k2.5"
  embedding: "dashscope:multimodal-embedding-v1"

# ============================================================
# AGENT (Unified)
# ============================================================
agent:
  autonomous:
    enabled: false
    max_parallel_goals: 6    # Increased from default 3 for better goal concurrency
    max_loops: 8             # Increased from default 4 for more worker loops
  loop:
    concurrency:
      max_parallel_goals: 8       # Increased from 4 for more concurrent goals
      max_parallel_steps: 8       # Increased from 4 for more parallel steps
      max_parallel_subagents: 6   # Increased from 4 for more subagent parallelism
      max_parallel_tools: 64      # Increased from 50 for higher tool throughput
      global_max_llm_calls: 16    # Increased from 10 for more concurrent LLM calls
      step_parallelism: max       # Changed from 'dependency' for maximum parallelism
    max_subagent_tasks_per_wave: 8  # Increased from 4 for larger subagent batches
  # Embedded QuickJS interpreter for programmatic tool calling (PTC).
  # Dependency note: langchain-quickjs is included in soothe base dependencies.
  code_interpreter:
    enabled: false

# SQLite reader pool for concurrent database access
persistence:
  sqlite_reader_pool_size: 12  # Increased from default 8 for better DB concurrency

# ============================================================
# OBSERVABILITY
# ============================================================
observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# ============================================================
# PERSISTENCE & STORAGE (SQLite default)
# ============================================================
# SQLite is the default backend - no configuration needed.
# Data stored in $SOOTHE_HOME/data/ (metadata.db, checkpoints.db, vector.db).
# Supports multiple concurrent loops via WAL mode and reader pool.

