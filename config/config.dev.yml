# Local development defaults (DashScope / coding-plan routers, Docker Postgres + Langfuse).
# Unlisted keys use Soothe Pydantic defaults. Full default-aligned reference: config/config.template.yml.
#
# Docker (repo root): docker compose up -d  → Postgres + pgvector on localhost:6432
# Langfuse (optional): docker compose --profile langfuse up -d  → UI on :3300
# Keys: pk-lf-soothe-local / sk-lf-soothe-local (see docker-compose LANGFUSE_INIT_*). Export DASHSCOPE_*.

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - multimodal-embedding-v1

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.7-plus
      - qwen3.6-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - deepseek-v3.2

  - name: mlxserver
    provider_type: limited_openai
    api_base_url: "http://100.75.70.86:9271/v1"
    api_key: "fakeapikey"
    models:
      - glm-4.7-flash
      - glm-4.6v-flash
      - nomic-embed

router:
  default: "coding-plan:glm-5"
  fast: "coding-plan:kimi-k2.5"
  think: "coding-plan:glm-5"
  image: "coding-plan:kimi-k2.5"
  embedding: "dashscope:multimodal-embedding-v1"

# ============================================================
# AGENT (Unified)
# ============================================================
agent:
  name: Soothe
  core_agent_backend: langgraph
  autonomous:
    enabled: false
    max_iterations: 15
    # RFC-222: faster scheduling cadence for local iteration
    poll_interval: 2
    loop_idle_timeout: 60

  loop:
    max_iterations: 99
    # RFC-224: Context window management (dev defaults aligned with template)
    context_window_limit: 200000
    context_overflow_threshold_pct: 0.80
    context_compaction_target_pct: 0.60
    step_context_check_enabled: false
    plan_prompt_ledger:
      plan_ledger_max_messages: 20
    limits:
      max_parallel_steps: 4
      max_parallel_tools: 50
      llm_rpm_limit: 10000  # effectively disable rate limiting (max allowed)
      llm_concurrent_limit: 500  # effectively disable concurrent limit (max allowed)
      global_max_llm_calls: 10
      tool_call_limit:
        global_thread_limit: 200
        global_run_limit: 80

# ============================================================
# SUBAGENTS
# ============================================================
# Built-in subagents (explore, plan, tacitus) are registered automatically.
# browser_use requires soothe[browser_use]. Claude Code uses agent.core_agent_backend: claude.
subagents:
  browser_use:
    enabled: false

# ============================================================
# OBSERVABILITY
# ============================================================
observability:
  profile_model_calls: false
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# ============================================================
# PERSISTENCE & STORAGE
# ============================================================
persistence:
  default_backend: postgresql
  # Thread pool (daemon_config.dev.yml): one checkpointer + one StrangeLoop pool per daemon process.
  postgres_pool_min_size: 4
  checkpointer_pool_size: 24
  sloop_pool_size: 24
  postgres_pool_max_idle_seconds: 90
  postgres_pool_max_lifetime_seconds: 900
  postgres_pool_acquire_timeout_seconds: 30
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"

vector_stores:
  - name: pgvector_dev
    provider_type: pgvector
    dsn: "postgresql://postgres:postgres@127.0.0.1:6432/soothe_vectors"
    pool_size: 4

vector_store_router:
  default: pgvector_dev:soothe_default

# ============================================================
# SECURITY
# ============================================================
security:
  allow_paths_outside_workspace: false

# ============================================================
# OPTIMIZATION
# ============================================================
# Uses defaults from OptimizationConfig (IG-433).
# All semantic features enabled with graceful keyword/regex fallback.

# ============================================================
# PROGRESSIVE SKILL LOADING (RFC-105)
# ============================================================
progressive_skills:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
