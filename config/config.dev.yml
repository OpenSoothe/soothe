# Local development defaults (DashScope / coding-plan routers, Docker Postgres + Langfuse).
# Unlisted keys use Soothe Pydantic defaults. Full default-aligned reference: config/config.template.yml.
#
# Docker (repo root): docker compose up -d  → Postgres + pgvector on localhost:6432, Langfuse on :3300
# Keys: pk-lf-soothe-local / sk-lf-soothe-local (see docker-compose LANGFUSE_INIT_*). Export DASHSCOPE_*.

providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - qwen-max
      - qwen3.5-flash
      - qwen3.5-plus
      - MiniMax-M2.5
      - kimi-k2.5
      - multimodal-embedding-v1

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.5-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - deepseek-v3.2

  - name: mlxserver
    provider_type: limited_openai
    api_base_url: "http://100.75.70.86:9271/v1"
    api_key: "fakeapikey"
    models:
      - glm-4.7-flash
      - glm-4.6v-flash
      - nomic-embed

router:
  default: "coding-plan:glm-5"
  fast: "coding-plan:kimi-k2.5"
  think: "coding-plan:glm-5"
  image: "coding-plan:qwen3.5-plus"
  embedding: "dashscope:multimodal-embedding-v1"

# Built-in subagents (explore, plan, tacitus are registered in resolver/_resolver_tools.py).
# Community subagents (claude, browser_use) require soothe-community package — disable in core config.
# See: https://github.com/OpenSoothe/soothe-community for community agent extensions.
subagents:
  sample_echo:
    enabled: true
  browser_use:
    enabled: true
  claude:
    enabled: true

agent_loop:
  max_iterations: 99
  # Output streaming configuration (RFC-614)
  output_streaming:
    mode: adaptive                    # batch | adaptive (stream small, batch large)
    streaming_interval_ms: 200        # Daemon WebSocket batching interval
    tui_flush_interval_ms: 200        # TUI rendering flush interval
    adaptive_threshold_chars: 500     # Adaptive switch threshold (chars)
    file_output_threshold_chars: 5000 # Write goal_completion to file when larger (0 = never)
    file_output_preview_chars: 500    # Preview chars in TUI when saved to file
    file_output_dir: null             # Default: current workspace root/.soothe/output
  plan_prompt_ledger:
    plan_ledger_max_messages: 20
  limits:
    max_parallel_steps: 3
    max_parallel_tools: 30
    global_max_llm_calls: 10
    tool_call_limit:
      global_thread_limit: 200
      global_run_limit: 80

observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

persistence:
  default_backend: postgresql
  # Thread pool mode (daemon_config.dev.yml): pools are daemon-level singletons (IG-406)
  # Can use larger pools for high concurrency since they're shared across all threads.
  checkpointer_pool_size: 8      # Thread pool: shared singleton, larger for concurrency
  agentloop_pool_size: 12        # Thread pool: shared singleton (IG-406)
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"

vector_stores:
  - name: pgvector_dev
    provider_type: pgvector
    dsn: "postgresql://postgres:postgres@127.0.0.1:6432/soothe_vectors"
    pool_size: 4

vector_store_router:
  default: pgvector_dev:soothe_default
