# Development Configuration - Essential dev settings only
# Inherits defaults from config/config.template.yml
#
# workspace_dir defaults to $SOOTHE_HOME/Workspace (IG-327). Set workspace_dir here to
# pin a project directory for local dev.
#
# Docker prerequisites (repo root):
#   1. PostgreSQL + pgvector (RFC-612 DBs):  docker compose up -d
#      Host port 6432 → container 5432; databases from config/init-db.sql
#   2. Langfuse UI (same compose file):     docker compose up -d
#      UI/API at http://localhost:3300 — keys pk-lf-soothe-local / sk-lf-soothe-local;
#      headless UI login dev@soothe.local / SootheLangfuseLocalDev1 (docker-compose.yml LANGFUSE_INIT_*).
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - qwen-max
      - qwen3.5-flash
      - qwen3.5-plus
      - MiniMax-M2.5
      - kimi-k2.5
      - multimodal-embedding-v1

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.5-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - deepseek-v3.2

  - name: mlxserver
    provider_type: limited_openai
    api_base_url: "http://100.75.70.86:9271/v1"
    api_key: "fakeapikey"
    models:
      - glm-4.7-flash
      - glm-4.6v-flash
      - nomic-embed

router:
  default: "coding-plan:kimi-k2.5"
  fast: "coding-plan:kimi-k2.5"
  think: "coding-plan:glm-5"
  image: "coding-plan:qwen3.5-plus"
  embedding: "dashscope:multimodal-embedding-v1"

# router:
#   default: "mlxserver:glm-4.7-flash"
#   fast: "mlxserver:glm-4.7-flash"
#   think: "mlxserver:glm-4.7-flash"
#   image: "mlxserver:glm-4.6v-flash"
#   embedding: "mlxserver:nomic-embed"

agentic:
  max_iterations: 6
  max_subagent_tasks_per_wave: 4
  final_response: adaptive
  goal_completion_mode: llm_only
  output_streaming: true
  reject_done_at_iteration_zero: false
  loop_orchestrator_evidence_validate: true
  plan_prompt_ledger:
    plan_ledger_max_messages: 40
    plan_ledger_max_total_chars: 60000
    plan_ledger_max_message_chars: 8000

execution:
  concurrency:
    # IG-380: lower parallel execute-step fan-out locally (template remains 16)
    max_parallel_steps: 2
    max_parallel_subagents: 4
  llm_rpm_limit: 120
  llm_concurrent_limit: 10
  llm_call_timeout_seconds: 120
  llm_call_timeout_max_seconds: 240  # IG-399: fail fast on pathological long calls
  llm_call_timeout_adaptive: true

observability:
  log_file_level: DEBUG
  verbosity: normal
  console:
    enabled: false
    level: WARNING
    stream: stderr
  global_history:
    enabled: true
    max_size: 5000
    dedup_window: 10
    retention_days: 90
  thread_logging_enabled: true
  thread_logging_retention_days: 30
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

daemon:
  max_concurrent_threads: 100
  max_input_queue_size: 1000         # Maximum pending input messages (0 = unlimited)
  max_concurrent_dispatches: 50      # Maximum concurrent message handlers
  transports:
    websocket:
      enabled: true
      host: "127.0.0.1"
      port: 8765
    http_rest:
      enabled: true
      host: "127.0.0.1"
      port: 8766

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  execution:
    enabled: true
  file_ops:
    enabled: true
  datetime:
    enabled: true
  data:
    enabled: true
  wizsearch:
    enabled: true
    default_engines:
      - tavily
  image:
    enabled: true
  audio:
    enabled: false
  video:
    enabled: false

  # LangChain RequestsToolkit (disable if outbound HTTP should not be allowed)
  http_requests:
    enabled: true
    allow_dangerous_requests: true
    verify_ssl: true

# =============================================================================
# Protocol Backends
# =============================================================================
protocols:
  planner:
    routing: auto
  policy:
    profile: standard
  memory:
    enabled: true
    persist_dir: ""
    llm_chat_role: fast
    llm_embed_role: embedding
    enable_embeddings: true
    enable_auto_categorization: true
    enable_category_summaries: true
  durability:
    thread_inactivity_timeout_hours: 72

# =============================================================================
# Persistence Configuration
# =============================================================================
# PostgreSQL via docker-compose soothe-pgvector service (host port 6432, RFC-612 multi-DB).
persistence:
  default_backend: postgresql
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"
  postgres_databases:
    checkpoints: soothe_checkpoints
    metadata: soothe_metadata
    vectors: soothe_vectors
    memory: soothe_memory

# =============================================================================
# Vector Store Providers
# =============================================================================
# pgvector on soothe_vectors (same compose stack as persistence).
vector_stores:
  - name: pgvector_dev
    provider_type: pgvector
    dsn: "postgresql://postgres:postgres@127.0.0.1:6432/soothe_vectors"
    pool_size: 5
    index_type: hnsw

vector_store_router:
  default: pgvector_dev:soothe_default

subagents:
  browser:
    enabled: false
    config:
      max_steps: 10

  explore:
    enabled: true
    # Model uses router fast role (coding-plan:kimi-k2.5)
    config:
      thoroughness: "medium"
      max_iterations:
        quick: 6      # IG-399: -50% from 12
        medium: 10    # IG-399: -58% from 24
        thorough: 16  # IG-399: -67% from 48
      max_read_lines: 50
      max_matches_returned: 5
      # IG-399: context growth capping
      max_history_messages_for_model: 8  # Keep only recent N message turns
      max_tool_output_chars_per_turn: 2000  # Truncate oversized tool outputs
      early_stop_no_new_findings_turns: 2  # Force synthesis when findings stall

# Note: Logging configuration moved to observability section above
