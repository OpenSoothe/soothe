# Team develop profile — overrides Pydantic defaults only.
# Full reference: config/config.template.yml
# Internal tuning (loop concurrency defaults, checkpoint async, tool_timeout, lazy_core_agent,
# code_interpreter, MemU memory) lives in packages/soothe/src/soothe/config/models.py.
#
# Zero-config: export OPENAI_API_KEY — no YAML required for OpenAI-only use.
# Persistence: PostgreSQL (docker compose up soothe-pgvector, port 6432)
# Langfuse: docker compose --profile langfuse up -d (UI on :3300)
# Keys: pk-lf-soothe-local / sk-lf-soothe-local; export DASHSCOPE_*

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5.2
      - qwen3.7-plus
      - qwen3.6-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - text-embedding-v4  # DashScope OpenAI-compatible text embedding (replaces multimodal-embedding-v1, which 404s in compat mode)

  - name: coding-plan
    provider_type: openai
    api_base_url: "${DASHSCOPE_CP_BASE_URL}"
    api_key: "${DASHSCOPE_CP_API_KEY}"
    models:
      - glm-5
      - qwen3.6-plus
      - kimi-k2.5
      - MiniMax-M2.5

  - name: omlx
    provider_type: openai
    api_base_url: "http://100.75.70.86:9642/v1"
    api_key: "mirasoth"
    models:
      - gemma-4-12b-coder-fable5-composer2.5
      - GLM-4.6V-Flash-4bit
      - Qwen3.6-27B-OptiQ-4bit
      - PaddleOCR-VL-1.5-4bit
      - DeepSeek-OCR-4bit
      - nomicai-modernbert-embed-base-bf16

router_profiles:
  - name: production
    router:
      default: "dashscope:glm-5.2"
      fast: "coding-plan:kimi-k2.5"
      think: "dashscope:glm-5.2"
      image: "coding-plan:kimi-k2.5"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"
      embedding: "omlx:nomicai-modernbert-embed-base-bf16"
    embedding_dims: 768  # nomicai-modernbert-embed-base-bf16 output size

  - name: local-deploy
    router:
      default: "omlx:Qwen3.6-27B-OptiQ-4bit"
      fast: "omlx:gemma-4-12b-coder-fable5-composer2.5"
      think: "omlx:Qwen3.6-27B-OptiQ-4bit"
      image: "omlx:GLM-4.6V-Flash-4bit"
      ocr: "omlx:DeepSeek-OCR-4bit"
      embedding: "omlx:nomicai-modernbert-embed-base-bf16"
    embedding_dims: 768  # nomicai-modernbert-embed-base-bf16 output size

# Switch profiles: production (DashScope) | local-deploy (oMLX :9642)
active_router_profile: production

# ============================================================
# AGENT (team concurrency overrides only)
# ============================================================
agent:
  agent_instructions_max_chars: 8000
  runtime:
    lazy_core_agent: true  # pair with daemon thread_pool.warmup_core_agent for fast TUI
    general_purpose_subagent: false
    role_routing:
      enabled: true
      orchestration_model_role: fast
      generation_model_role: default
      max_orchestration_hops: 1
  autopilot:
    enabled: true
    max_parallel_goals: 6
    max_loops: 8
  loop:
    concurrency:
      max_parallel_goals: 8
      max_parallel_steps: 8
      max_parallel_subagents: 6
      max_parallel_tools: 64
      global_max_llm_calls: 16
      step_parallelism: max
    max_subagent_tasks_per_wave: 8
    plan_assess_model_role: fast
    plan_generate_model_role: think
    execute_prompt_ledger:
      cross_goal_completion_tail: 3
      predecessor_max_messages: 96
    llm_rate_limit:
      rate_limit_retry_timeout_seconds: 120

# ============================================================
# PERSISTENCE
# ============================================================
persistence:
  default_backend: postgresql
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"
  postgres_pool_max_idle_seconds: 90
  postgres_pool_max_lifetime_seconds: 900

security:
  allow_paths_outside_workspace: true

# ============================================================
# OBSERVABILITY
# ============================================================
observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# ============================================================
# CRON (RFC-229 — natural language scheduled jobs)
# ============================================================
cron:
  max_jobs: 100
  poll_interval: 60
  extraction_model: fast
  extraction_timeout: 30
  default_priority: 50
  timezone: local

# ============================================================
# VECTOR STORES (pgvector; DSN auto-resolved from postgres_base_dsn)
# ============================================================
vector_stores:
  - name: pgvector_dev
    provider_type: pgvector

vector_store_router:
  default: pgvector_dev:soothe_default

# ============================================================
# PROGRESSIVE SKILLS (RFC-105 / IG-543)
# ============================================================
progressive_skills:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
  core_skills: null
  search_skills_enabled: true
  semantic_search_enabled: true
  semantic_search_min_score: 0.0
  intent_prefetch_enabled: true
  core_intent_auto_invoke_enabled: true
  intent_prefetch_top_k: 2
  intent_prefetch_min_query_chars: 4
