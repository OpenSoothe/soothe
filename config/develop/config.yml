# Team develop profile — overrides Pydantic defaults only.
# Full reference: config/config.template.yml
# Internal tuning (loop concurrency defaults, checkpoint async, tool_timeout, lazy_core_agent,
# code_interpreter, MemU memory) lives in packages/soothe/src/soothe/config/models.py.
#
# Zero-config: export OPENAI_API_KEY — no YAML required for OpenAI-only use.
# Persistence: PostgreSQL (docker compose up soothe-pgvector, port 6432)
# Langfuse: docker compose --profile langfuse up -d (UI on :3300)
# Keys: pk-lf-soothe-local / sk-lf-soothe-local; export DASHSCOPE_*

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5.2
      - qwen3.7-plus
      - kimi-k2.5
      - kimi-k2.7-code
      - MiniMax-M3
      - text-embedding-v4  # DashScope OpenAI-compatible text embedding (replaces multimodal-embedding-v1, which 404s in compat mode)

  - name: agnes
    provider_type: openai
    api_base_url: "https://apihub.agnes-ai.com/v1"
    api_key: "${AGNESAI_API_KEY}"
    models:
      - agnes-2.0-flash
      - agnes-2.5-flash
      - agnes-image-2.0-flash
      - agnes-image-2.1-flash

  - name: omlx
    provider_type: openai
    api_base_url: "http://100.75.70.86:9642/v1"
    api_key: "mirasoth"
    models:
      - gemma-4-12b-coder-fable5-composer2.5
      - GLM-4.6V-Flash-4bit
      - Qwen3.6-27B-OptiQ-4bit
      - PaddleOCR-VL-1.5-4bit
      - DeepSeek-OCR-4bit
      - nomicai-modernbert-embed-base-bf16

router_profiles:
  - name: production
    router:
      default: "dashscope:glm-5.2"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:glm-5.2"
      image: "dashscope:qwen3.7-plus"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"

  - name: production-minimax
    router:
      default: "dashscope:MiniMax-M3"
      fast: "dashscope:qwen3.6-flash"
      think: "dashscope:MiniMax-M3"
      image: "dashscope:MiniMax-M3"
      ocr: "omlx,PaddleOCR-VL-1.5-4bit"

  - name: agnes-eval
    router:
      default: "agnes:agnes-2.0-flash"
      image: "agnes:agnes-image-2.0-flash"
      ocr: "omlx:DeepSeek-OCR-4bit"

  - name: local-deploy
    router:
      default: "omlx:Qwen3.6-27B-OptiQ-4bit"
      fast: "omlx:gemma-4-12b-coder-fable5-composer2.5"
      think: "omlx:Qwen3.6-27B-OptiQ-4bit"
      image: "omlx:GLM-4.6V-Flash-4bit"
      ocr: "omlx:DeepSeek-OCR-4bit"

# Switch profiles: production (DashScope) | local-deploy (oMLX :9642)
active_router_profile: production

embedding_profile:
  - model_role: openai:text-embedding-3-small
    embedding_dims: 1536

# ============================================================
# AGENT (team concurrency overrides only)
# ============================================================
agent:
  agent_instructions_max_chars: 8000
  runtime:
    lazy_core_agent: true  # pair with daemon thread_pool.warmup_core_agent for fast TUI
    general_purpose_subagent: false
    role_routing:
      enabled: true
      orchestration_model_role: fast
      generation_model_role: default
      max_orchestration_hops: 1
  autopilot:
    enabled: true
    max_parallel_goals: 6
    max_loops: 8
    goal_deadline_seconds: 1209600  # 14d wall-clock budget per dispatched goal
    monitor_model_role: think
    consensus_model_role: think
  loop:
    max_plan_steps_per_wave: 10
    concurrency:
      max_parallel_goals: 8
      max_parallel_steps: 8
      max_parallel_subagents: 6
      max_parallel_tools: 64
      global_max_llm_calls: 16
      step_parallelism: max
      checkpoint:
        flush_interval: 5.0
        close_timeout_seconds: 30
        durable_flush_timeout: 10
    max_tool_calls_per_step: 999
    dispatch_timeout_seconds: 0
    execute_action_retry_max: 1
    execute_min_answer_chars: 20
    execute_deliverable_assess: auto
    step_completion_report_max_words: 50
    max_subagent_tasks_per_wave: 8
    plan_assess_model_role: fast
    plan_generate_model_role: think
    plan_gap_analysis_enabled: true
    rules:
      completion:
        dag_dependency_threshold: 3
        low_success_rate_threshold: 0.6
        simple_ledger_direct_max_steps: 1
        ledger_direct_max_tool_calls: 50
      scenario:
        skip_llm_when_single_step: true
        skip_llm_when_all_failed: true
        high_step_count_threshold: 4
        low_evidence_volume_threshold: 2000
      plan_safety:
        banned_step_patterns:
          - "^(wrap up|conclude|terminate|stop|halt|cease|end process|close|exit|quit|finish up|complete process|final step|last step|the end)$"
        simple_evidence_min_chars: 200
    plan_prompt_ledger:
      plan_ledger_max_messages: 40
      plan_ledger_max_total_chars: 0
      plan_ledger_max_message_chars: 0
    plan_assess_prompt:
      ledger_max_messages: 24
      execute_ai_max_chars: 400
      keep_head_tail_execute_ai: true
      omit_prior_progress_hint: true
      include_plan_coverage: true
    execute_prompt_ledger:
      cross_goal_completion_tail: 3
      predecessor_max_messages: 96
      execute_ai_ledger_max_tokens: 65536
    llm_rate_limit:
      rate_limit_retry_timeout_seconds: 120

# ============================================================
# PERSISTENCE
# ============================================================
persistence:
  default_backend: postgresql
  postgres_base_dsn: "postgresql://postgres:postgres@127.0.0.1:6432"
  postgres_pool_min_size: 4
  checkpoints_pool_size: 32
  metadata_pool_size: 16
  vectors_pool_size: 16
  postgres_pool_max_idle_seconds: 90
  postgres_pool_max_lifetime_seconds: 900
  postgres_pool_acquire_timeout_seconds: 45

security:
  allow_paths_outside_workspace: true

# ============================================================
# OBSERVABILITY
# ============================================================
observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# ============================================================
# CRON (RFC-229 — natural language scheduled jobs)
# ============================================================
cron:
  max_jobs: 100
  poll_interval: 60
  extraction_model: fast
  extraction_timeout: 30
  default_priority: 50
  timezone: local

# ============================================================
# VECTOR STORES (pgvector; DSN auto-resolved from postgres_base_dsn)
# ============================================================
vector_stores:
  - name: pgvector_dev
    provider_type: pgvector

vector_store_router:
  default: pgvector_dev:soothe_default

# ============================================================
# PROGRESSIVE SKILLS (RFC-105 / IG-543)
# ============================================================
progressive_skills:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
  core_skills: null
  search_skills_enabled: true
  semantic_search_enabled: true
  semantic_search_min_score: 0.0
  intent_prefetch_enabled: true
  core_intent_auto_invoke_enabled: true
  intent_prefetch_top_k: 2
  intent_prefetch_min_query_chars: 4

# ============================================================
# TOOLS (execution background logs)
# ============================================================
tools:
  execution:
    enabled: true
    background_log_dir: null
    background_log_retention_days: 7

# ============================================================
# SKILLIFY (daemon-shared semantic skill search)
# ============================================================
skillify:
  enabled: false
  model_role: embedding
  warehouse_paths: []
  index_collection: soothe_skillify
  index_interval_seconds: 300
  retrieval_top_k: 10

# ============================================================
# MCP (RFC-412 — progressive disclosure; opt-in builtins)
# ============================================================
mcp_servers: []
mcp_builtins: []
progressive_mcp:
  budget_pct: 0.01
  max_listing_chars_per_entry: 250
  min_listing_chars_per_entry: 20
