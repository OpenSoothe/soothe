# Local development defaults (overrides Pydantic defaults)
# Full reference: config/config.template.yml
# Persistence: SQLite by default
# Langfuse: docker compose --profile langfuse up -d (UI on :3300)
# Keys: pk-lf-soothe-local / sk-lf-soothe-local; export DASHSCOPE_*

# ============================================================
# PROVIDERS
# ============================================================
providers:
  - name: dashscope
    provider_type: openai
    api_base_url: "${DASHSCOPE_BASE_URL}"
    api_key: "${DASHSCOPE_API_KEY}"
    models:
      - glm-5
      - glm-5.2
      - qwen3.7-plus
      - qwen3.6-plus
      - kimi-k2.5
      - MiniMax-M2.5
      - multimodal-embedding-v1

  - name: local-omlx
    provider_type: openai
    api_base_url: "http://100.75.70.86:9642/v1"
    api_key: "mirasoth"
    models:
      - gemma-4-12b-coder-fable5-composer2.5
      - GLM-4.6V-Flash-8bit
      - nomicai-modernbert-embed-base-bf16

# Active router — local oMLX (:9642): gemma coder for LLM, GLM-4.6V for vision
router:
  default: "local-omlx:gemma-4-12b-coder-fable5-composer2.5"
  fast: "local-omlx:gemma-4-12b-coder-fable5-composer2.5"
  think: "local-omlx:gemma-4-12b-coder-fable5-composer2.5"
  image: "local-omlx:GLM-4.6V-Flash-8bit"
  embedding: "local-omlx:nomicai-modernbert-embed-base-bf16"

# --- DashScope router (commented; original develop defaults — swap in when using cloud) ---
# Requires: export DASHSCOPE_BASE_URL, DASHSCOPE_API_KEY
# Uses models from providers.dashscope above (glm-5, glm-5.2, qwen3.x, kimi-k2.5, etc.)
#
# router:
#   default: "dashscope:glm-5.2"
#   fast: "dashscope:kimi-k2.5"
#   think: "dashscope:glm-5.2"
#   image: "dashscope:kimi-k2.5"
#   embedding: "dashscope:multimodal-embedding-v1"

# ============================================================
# AGENT
# ============================================================
agent:
  autonomous:
    enabled: true
    max_parallel_goals: 6    # Increased from default 3 for better goal concurrency
    max_loops: 8             # Increased from default 4 for more worker loops
  loop:
    concurrency:
      max_parallel_goals: 8       # Increased from 4 for more concurrent goals
      max_parallel_steps: 8       # Increased from 4 for more parallel steps
      max_parallel_subagents: 6   # Increased from 4 for more subagent parallelism
      max_parallel_tools: 64      # Increased from 50 for higher tool throughput
      global_max_llm_calls: 16    # Increased from 10 for more concurrent LLM calls
      step_parallelism: max       # Changed from 'dependency' for maximum parallelism
      # RFC-803 Phase 6: Async checkpoint writes
      checkpoint:
        async_write: true        # Enable fire-and-forget writes (non-blocking)
        flush_interval: 5.0       # Periodic forced write interval (seconds)
        queue_size: 100           # Max queued checkpoints before blocking
    max_subagent_tasks_per_wave: 8  # Increased from 4 for larger subagent batches
    tool_timeout:
      enabled: true
  # QuickJS interpreter for programmatic tool calling (PTC)
  code_interpreter:
    enabled: false
  runtime:
    lazy_core_agent: true

# SQLite reader pool for concurrent database access
persistence:
  sqlite_reader_pool_size: 12  # Increased from default 8 for better DB concurrency

security:
  allow_paths_outside_workspace: true

# ============================================================
# OBSERVABILITY
# ============================================================
observability:
  log_file_level: DEBUG
  langfuse:
    enabled: true
    public_key: pk-lf-soothe-local
    secret_key: sk-lf-soothe-local
    host: http://localhost:3300
    trace_name: soothe-dev
    tags:
      - soothe

# ============================================================
