# Soothe daemon server configuration (SootheDaemonConfig).
#
# Install: ~/.soothe/config/daemon_config.yml
# CLI:     soothed --config <path>
#
# This file configures the daemon process only (listeners, concurrency, worker pool).
# Agent models, tools, and protocols live in a separate YAML (SootheConfig),
# loaded from ~/.soothe/config/config.yml by default.
#
# Environment overrides: prefix SOOTHE_DAEMON_, nested keys use __
# Example: SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__PORT=9000
#
# Defaults align with soothe_daemon.config.settings.SootheDaemonConfig and
# soothe_daemon.config.models (WebSocketConfig, HttpRestConfig, …).

transports:
  # WebSocket is required. This block sets the TCP bind address and TLS for the
  # shared ASGI app when HTTP REST is enabled below.
  websocket:
    enabled: true
    host: 127.0.0.1
    port: 8765
    tls_enabled: false
    tls_cert: null
    tls_key: null
    cors_origins:
      - http://localhost:*
      - http://127.0.0.1:*
    max_frame_size: 10485760
  # HTTP REST (health checks, REST API). When enabled, REST is served on the same
  # TCP port as WebSocket (unified ASGI stack); host/port/tls fields here are ignored.
  http_rest:
    enabled: false
    cors_origins:
      - http://localhost:*
      - http://127.0.0.1:*

# Concurrency and safety
max_concurrent_threads: 100
max_query_duration_minutes: 60
cancel_grace_seconds: 30
hitl_timeout_seconds: 30
query_timeout_action: cancel
thread_max_age_hours: 24
auto_cancel_on_startup: true
max_input_queue_size: 1000
max_concurrent_dispatches: 50
# Cap parallel image-role vision preflight on the daemon (0 = unlimited).
max_concurrent_vision_preflight: 8

# EventBus JSON wire-size distribution logging (optional diagnostics)
event_size_stats_enabled: true
event_size_stats_interval_seconds: 60
event_size_stats_idle_pause_seconds: 120

# Distributed loop execution (Ray)
distributed:
  enabled: false
  ray:
    address: null
    num_cpus: 0.0
    object_store_memory: 0
    max_concurrent_actors: 10
    actor_lifetime: detached
    log_to_driver: true

# Persistent worker pool (local multiprocessing)
worker_pool:
  enabled: true
  min_pool_size: 2
  max_pool_size: 4
  idle_timeout_seconds: 300
  max_requests_per_worker: 100
  request_timeout_seconds: 1800
  heartbeat_interval_seconds: 30
  stuck_worker_timeout_seconds: 180
  dispatch_wait_stats_enabled: true
  dispatch_wait_stats_interval_seconds: 60
  dispatch_wait_stats_idle_pause_seconds: 120
