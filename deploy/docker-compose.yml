# Soothe Production Stack - PostgreSQL + pgvector + Soothe Daemon
# RFC-612: Multi-database PostgreSQL architecture.
#
# Usage:
#   docker compose up -d
#
# Prerequisites:
#   1. cp .env.example .env && configure secrets
#   2. cp config.yml.example config.yml

services:
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    networks:
      - soothe-db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - soothe_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  soothed:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/soothed:${SOOTHE_VERSION:-0.6.4}
    restart: unless-stopped
    depends_on:
      soothe-pgvector:
        condition: service_healthy
    networks:
      - soothe-db
      - soothe-app
    environment:
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      DASHSCOPE_CP_BASE_URL: ${DASHSCOPE_CP_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
      DASHSCOPE_CP_API_KEY: ${DASHSCOPE_CP_API_KEY:?DASHSCOPE_CP_API_KEY is required}
      SOOTHE_DAEMON_SOOTHE_CONFIG_PATH: /app/config.yml
      SOOTHE_POSTGRES_BASE_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@soothe-pgvector:5432
      SOOTHE_POSTGRES_VECTORS_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@soothe-pgvector:5432/soothe_vectors
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__HOST: 0.0.0.0
      SOOTHE_DAEMON_TRANSPORTS__HTTP_REST__ENABLED: true
      SOOTHE_DAEMON_TRANSPORTS__HTTP_REST__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - soothe_daemon_data:/var/lib/soothe
      - ./config.yml:/app/config.yml:ro
      - ./logs:/var/lib/soothe/logs
      - ${SOOTHE_WORKSPACE_HOST_ROOT:-/workspace}:/var/lib/soothe/workspaces
    deploy:
      resources:
        limits:
          memory: ${DOCKER_MEM_LIMIT:-4g}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)" || exit 1
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  soothe-db:
    driver: bridge
  soothe-app:
    driver: bridge

volumes:
  soothe_postgres_data:
    name: soothe_postgres_data
  soothe_daemon_data:
    name: soothe_daemon_data