# Docker Compose for Soothe Production Deployment
# Self-contained production stack: PostgreSQL + pgvector + Soothe daemon
#
# Usage (from deploy/ directory):
#   docker compose up -d                    # Start production stack
#   docker compose down                     # Stop stack
#   docker compose ps                       # Show status
#
# Required environment variables (set in deploy/.env):
#   DASHSCOPE_API_KEY=...                   # DashScope provider key
#   SOOTHE_WORKSPACE_HOST_ROOT=...          # Host workspace directory to mount

services:
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=64MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - soothe-db
    expose:
      - "5432"
    volumes:
      - soothe_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  soothed:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/soothed:0.6.12
    restart: unless-stopped
    depends_on:
      soothe-pgvector:
        condition: service_healthy
    networks:
      - soothe-db
      - soothe-app
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SOOTHE_DAEMON_SOOTHE_CONFIG_PATH: /app/config.yml
      SOOTHE_POSTGRES_BASE_DSN: postgresql://postgres:postgres@soothe-pgvector:5432
      SOOTHE_POSTGRES_VECTORS_DSN: postgresql://postgres:postgres@soothe-pgvector:5432/soothe_vectors
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__HOST: 0.0.0.0
      SOOTHE_DAEMON_TRANSPORTS__HTTP_REST__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - soothe_daemon_data:/var/lib/soothe
      - ./config.prod.yml:/app/config.yml:ro
      - ./logs:/var/lib/soothe/logs
      - ${SOOTHE_WORKSPACE_HOST_ROOT:-./workspaces}:/var/lib/soothe/workspaces
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)" || exit 1
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  soothe-db:
  soothe-app:

volumes:
  soothe_postgres_data:
  soothe_daemon_data:
