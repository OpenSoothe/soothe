# Soothe runtime stack (production-ready)
# Multi-database PostgreSQL + pgvector for checkpoints, metadata, vectors, memory.
#
# Usage:
#   docker compose up -d
#
# Override secrets via environment or a .env file next to this compose file:
#   POSTGRES_PASSWORD=...   # required in production
services:
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../config/init-db.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256mb

volumes:
  postgres_data:
