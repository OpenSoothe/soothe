# Soothe production stack - PostgreSQL + pgvector + Soothe Daemon
# Multi-database PostgreSQL architecture with layered networks.
#
# Usage:
#   docker compose up -d
#
# Environment variables (set in .env file):
#   POSTGRES_PASSWORD=...            # PostgreSQL password
#   DASHSCOPE_API_KEY=...            # DashScope provider key
#   DASHSCOPE_CP_API_KEY=...         # Coding-Plan provider key
#   DASHSCOPE_BASE_URL=...           # DashScope API base URL
#   DASHSCOPE_CP_BASE_URL=...        # Coding-Plan API base URL

services:
  # PostgreSQL + pgvector multi-database backend
  soothe-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks:
      - soothe-db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - soothe_postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 256mb

  # Soothe Daemon - orchestration server
  soothed:
    image: registry.cn-hangzhou.aliyuncs.com/lacogito/soothed:latest
    restart: unless-stopped
    depends_on:
      soothe-pgvector:
        condition: service_healthy
    networks:
      - soothe-db
      - soothe-app
    environment:
      # Provider credentials
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_CP_BASE_URL: ${DASHSCOPE_CP_BASE_URL:-https://coding.dashscope.aliyuncs.com/v1}
      DASHSCOPE_CP_API_KEY: ${DASHSCOPE_CP_API_KEY}
      # PostgreSQL connection strings (RFC-612 multi-database)
      SOOTHE_POSTGRES_BASE_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@soothe-pgvector:5432
      SOOTHE_POSTGRES_VECTORS_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@soothe-pgvector:5432/soothe_vectors
      SOOTHE_DAEMON_TRANSPORTS__WEBSOCKET__HOST: 0.0.0.0
      SOOTHE_DAEMON_TRANSPORTS__HTTP_REST__ENABLED: true
      SOOTHE_DAEMON_TRANSPORTS__HTTP_REST__HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - soothe_daemon_data:/var/lib/soothe
      - ./config.yml:/var/lib/soothe/config/config.yml:ro
      # RFC-621: Workspace host convention — mount host workspace root.
      - /Users/xiaming/Workspace:/var/lib/soothe/workspaces
    healthcheck:
      # Check WebSocket port is listening - accept any HTTP response (even 404 means server is up)
      # More stable than socket.connect() which can timeout during LLM processing
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://localhost:8765/ | grep -E '^[0-9]+$' || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 30s

networks:
  soothe-db:
    driver: bridge
  soothe-app:
    driver: bridge

volumes:
  soothe_postgres_data:
    name: soothe_postgres_data
  soothe_daemon_data:
    name: soothe_daemon_data
