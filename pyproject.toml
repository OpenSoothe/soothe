[project]
name = "soothe-workspace"
version = "0.0.0"
description = "Soothe monorepo workspace (meta-package, no dependencies)"
# Cap below 3.15 until upstream wheels/markers are validated (uv resolves all supported versions).
requires-python = ">=3.11,<3.15"
dependencies = [
    "soothe-sdk",
    "soothe-cli",
    "soothe",
    "soothe-daemon",
]

[tool.uv.workspace]
members = ["packages/*"]

# Pin the default package index to PyPI so `uv sync` / `make all-sync` work even when the
# environment sets UV_INDEX_URL or UV_DEFAULT_INDEX to a broken or unreachable mirror.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
soothe-sdk = { workspace = true }
soothe-cli = { workspace = true }
soothe = { workspace = true }
soothe-daemon = { workspace = true }

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=9.0.2",
    "textual-dev>=1.8.0",
    "langfuse>=3.0.0,<4.0.0",
    "pyinstaller>=6.20.0",
]

[tool.pytest.ini_options]
# Use importlib import mode to handle duplicate module names in monorepo
testpaths = ["packages", "tests"]
addopts = "--import-mode=importlib"

# Ruff config for root-level directories (examples/, scripts/)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
# Example files are intentionally numbered for ordering (01_, 02_, etc.)
per-file-ignores = { "examples/core_agent/*.py" = ["N999"] }

[tool.ruff.format]
docstring-code-format = true
