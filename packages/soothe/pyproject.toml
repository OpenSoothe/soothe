[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soothe"
dynamic = ["version"]
description = "Soothe - Goal-driven multi-agent orchestration framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
keywords = ["soothe", "agents", "ai", "llm", "langgraph", "langchain", "multi-agent", "subagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "soothe-sdk>=0.5.25,<1.0.0",    # Subagent wire registry + community delegate types
    "aiohttp>=3.9.0,<4.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "anyio>=3.0.0,<5.0.0",
    "bubus>=1.5.6",
    "deepagents>=0.4.10,<1.0.0",
    "jinja2>=3.1.0",    # Prompt fragment template rendering
    "langchain>=1.2.11,<2.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "langchain-experimental>=0.0.50,<1.0.0",
    "langchain-core>=1.2.18,<2.0.0",
    "langchain-mcp-adapters>=0.2.0,<1.0.0",
    "langchain-openai>=0.3.0,<1.0.0",
    "langchain-quickjs>=0.1.0",
    # Direct pin: langchain-openai needs openai>=1.104.2 (DefaultHttpxClient, etc.).
    # Declaring it here avoids broken/partial installs resolving without a full openai wheel.
    "openai>=1.104.2,<3.0.0",
    # Direct pin: langchain-anthropic (via deepagents) needs anthropic>=0.96 with DefaultHttpxClient.
    "anthropic>=0.96.0,<1.0.0",
    "langgraph>=1.1.1,<2.0.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
    "sqlite-vec>=0.1.0",
    "pexpect>=4.9.0,<5.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pathspec>=0.12.0,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "psycopg[binary,pool]>=3.2.0,<4.0.0",
    # 3.1+ aligns with langgraph-checkpoint 4.x; 2.x/3.0.x require checkpoint <4
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
research = [
    "arxiv>=2.1.0",
    "langchain-tavily>=0.2.17",
    "tavily-python>=0.5.0",
    "wizsearch>=1.1.8,<2.0.0",
    "chardet<6",
    "deepxiv-sdk>=0.2.5",
]
tabular = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]
document = [
    "PyMuPDF>=1.24.0",
    "pypdf>=3.0.0",
    "docx2txt>=0.8.0",
]
media = [
    "pillow>=10.0.0",
    "pydub>=0.25.0",
    "yt-dlp>=2023.0.0",
]
video = [
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]
github = [
    "pygithub>=2.0.0",
]
semantic = [
    "sentence-transformers>=2.2.0",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
dashscope = [
    "dashscope>=1.20.0",
]
browser_use = [
    "browser-use>=0.11.0,<0.13.0",
]
claude = [
    "anthropic>=0.96.0,<1.0.0",
    "claude-agent-sdk>=0.1.0,<1.0.0",
]
all = [
    "soothe[research,tabular,document,media,video,github,dashscope,semantic,langfuse,browser_use,claude]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "soothe[langfuse]",
]

[project.entry-points."soothe.plugins"]
browser_use = "soothe.subagents.browser_use:BrowserUsePlugin"

[project.urls]
Homepage = "https://github.com/mirasoth/soothe"
Repository = "https://github.com/mirasoth/soothe"

[tool.hatch.build.targets.wheel]
packages = ["src/soothe"]

[tool.hatch.build.targets.sdist]
include = ["src/soothe/"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "slow: long-running or stress tests",
]
