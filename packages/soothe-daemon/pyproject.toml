[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soothe-daemon"
dynamic = ["version"]
description = "Soothe daemon server - long-running agent runtime with WebSocket/HTTP transports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
keywords = ["soothe", "daemon", "server", "websocket", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "soothe>=0.5.25,<1.0.0",        # in-proc agent core (PyPI)
    "soothe-nano>=0.9.4,<1.0.0",   # Coding CoreAgent runtime (skills/MCP/backends; direct, not only via soothe)
    "soothe-sdk>=1.0.2,<2.0.0",    # Subagent wire helpers (types owned by soothe subagents)
    "soothe-client-python>=0.10.0,<1.0.0",  # admin CLI + tests WebSocket client
    "aiohttp>=3.9.0,<4.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "psutil>=5.9.0,<8.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "typer>=0.9.0,<2.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "websockets>=12.0,<16.0",
    # External channel dependencies (migrated from nanoBot)
    "python-telegram-bot[socks,webhooks]>=22.6,<23.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "discord.py>=2.5.2,<3.0.0",
    "matrix-nio>=0.25.2; sys_platform != 'win32'",  # e2e extra requires python-olm which has CMake issues
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
    "wecom-aibot-sdk-python>=0.1.5",
    "qrcode[pil]>=8.0",
    "pycryptodome>=3.20.0",
    "PyJWT>=2.0,<3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "soothe-cli>=0.5.25",  # For CLI integration tests (PyPI)
]

[project.scripts]
soothed = "soothe_daemon.cli:app"

[project.urls]
Homepage = "https://github.com/mirasoth/soothe"
Documentation = "https://soothe.readthedocs.io"
Repository = "https://github.com/mirasoth/soothe"

[tool.hatch.build.targets.wheel]
packages = ["src/soothe_daemon"]

[tool.hatch.build.targets.sdist]
include = ["src/soothe_daemon/"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/soothe_daemon/cli.py" = ["E402"]
"src/soothe_daemon/bootstrap/entrypoint.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../soothe/tests"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "slow: long-running or stress tests",
]
