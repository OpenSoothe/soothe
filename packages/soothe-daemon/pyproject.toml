[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soothe-daemon"
dynamic = ["version"]
description = "Soothe daemon server - long-running agent runtime with WebSocket/HTTP transports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
keywords = ["soothe", "daemon", "server", "websocket", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "soothe>=0.5.0,<1.0.0",         # in-proc agent core
    "soothe-sdk>=0.5.0,<1.0.0",     # WebSocket protocol
    "aiohttp>=3.9.0",
    "fastapi>=0.104.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "requests>=2.32.3",
    "typer>=0.9.0,<1.0.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
soothed = "soothe_daemon.cli.daemon_main:app"

[project.urls]
Homepage = "https://github.com/OpenSoothe/soothe"
Documentation = "https://soothe.readthedocs.io"
Repository = "https://github.com/OpenSoothe/soothe"

[tool.hatch.build.targets.wheel]
packages = ["src/soothe_daemon"]

[tool.hatch.build.targets.sdist]
include = ["src/soothe_daemon/"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.hatch.version]
path = "../../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "slow: long-running or stress tests",
]
