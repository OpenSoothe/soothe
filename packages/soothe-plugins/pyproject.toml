[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soothe-plugins"
version = "0.2.6"
description = "Community plugins for Soothe agent orchestration framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
keywords = ["soothe", "plugins", "agents", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "soothe-sdk>=0.5.9,<1.0.0",
    "langgraph>=1.1.1,<2.0.0",
    "arxiv>=2.0.0,<3.0.0",
    "pyzotero>=1.5.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "numpy>=1.20.0,<3.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "feedparser>=6.0.0,<7.0.0",
]

[tool.uv.sources]
soothe-sdk = { workspace = true }

[project.urls]
Homepage = "https://github.com/mirasoth/soothe-plugins"
Repository = "https://github.com/mirasoth/soothe-plugins"
Issues = "https://github.com/mirasoth/soothe-plugins/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.entry-points."soothe.plugins"]
sample_echo = "soothe_plugins.sample_echo:SampleEchoPlugin"
weaver = "soothe_plugins.weaver:WeaverPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/soothe_plugins"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "soothe_sdk.*",
    "sklearn.*",
    "arxiv.*",
    "pyzotero.*",
    "yaml",
    "numpy",
]
ignore_missing_imports = true
ignore_errors = true
