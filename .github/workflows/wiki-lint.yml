name: Wiki Staleness Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-lint.yml'
      - 'scripts/lint_wiki_staleness.sh'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-lint.yml'
      - 'scripts/lint_wiki_staleness.sh'

permissions:
  contents: read

jobs:
  wiki-staleness-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run wiki staleness lint
        run: ./scripts/lint_wiki_staleness.sh
