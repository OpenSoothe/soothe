name: Build Docker Image

on:
  workflow_run:
    workflows: ["Release Soothe Packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      soothe_version:
        description: "Version for soothe / soothe-sdk / soothe-daemon wheels (omit for latest GitHub release in this repo)"
        required: false
        default: ""
        type: string
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: lacogito
  IMAGE_NAME: soothed
  # Avoid Docker Hub anonymous rate limits / auth.docker.io timeouts on GHA runners.
  PYTHON_BASE: registry.cn-hangzhou.aliyuncs.com/lacogito/python:3.12-bookworm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          set -euo pipefail
          ref=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ref="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release tag (manual / API)
        id: release_ref
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ github.event.inputs.soothe_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=""
          tag_ref=""

          api_get() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          # Probe a tag name via the API; echoes the tag if it exists, otherwise empty.
          tag_exists() {
            local cand="$1"
            if api_get "https://api.github.com/repos/${GH_REPO}/git/ref/tags/${cand}" >/dev/null 2>&1; then
              printf '%s' "$cand"
            fi
          }

          if [ -n "${INPUT_VERSION// }" ]; then
            v="${INPUT_VERSION#v}"
            # The repo may tag bare ("0.5.27") or v-prefixed ("v0.5.27").
            # Probe the API for whichever form actually exists.
            tag_ref="$(tag_exists "${v}")"
            if [ -z "${tag_ref}" ]; then
              tag_ref="$(tag_exists "v${v}")"
            fi
            if [ -z "${tag_ref}" ]; then
              echo "::error::No git tag found for version '${INPUT_VERSION}' (tried '${v}' and 'v${v}'). Push the tag before dispatching."
              exit 1
            fi
          else
            if ! json="$(api_get "https://api.github.com/repos/${GH_REPO}/releases/latest")"; then
              json=""
            fi
            tag_ref="$(printf '%s' "$json" | jq -r 'try .tag_name // empty')"
            if [ -n "$tag_ref" ] && [ "$tag_ref" != "null" ]; then
              v="${tag_ref#v}"
            else
              tag_ref=""
            fi
          fi

          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "tag_ref=${tag_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ steps.checkout_ref.outputs.ref || steps.release_ref.outputs.tag_ref || github.sha }}

      - name: Resolve Soothe version for Docker build
        id: soothe_version
        run: |
          set -euo pipefail
          v="${{ steps.release_ref.outputs.version }}"
          if [ -z "$v" ]; then
            v="$(tr -d ' \n\r\t' < VERSION)"
          fi
          if [ -z "$v" ]; then
            echo "::error::Could not resolve Soothe version (VERSION file empty and no release tag)"
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved SOOTHE_VERSION=${v}"

      - name: Wait for PyPI wheels
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          SOOTHE_VERSION: ${{ steps.soothe_version.outputs.version }}
        run: |
          set -euo pipefail
          wait_pkg() {
            local pkg="$1"
            echo "Waiting for ${pkg}==${SOOTHE_VERSION} on PyPI..."
            for attempt in $(seq 1 36); do
              if python -m pip index versions "${pkg}" 2>/dev/null | grep -qF "${SOOTHE_VERSION}"; then
                echo "✓ ${pkg} ${SOOTHE_VERSION} is on PyPI"
                return 0
              fi
              echo "  attempt ${attempt}/36: not yet available, sleeping 10s"
              sleep 10
            done
            echo "::error::Timed out waiting for ${pkg}==${SOOTHE_VERSION} on PyPI"
            return 1
          }
          python -m pip install --upgrade pip >/dev/null
          wait_pkg soothe
          wait_pkg soothe-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry publish eligibility
        id: publish
        env:
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          ready=false
          if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASS}" ]; then ready=true; fi
          echo "registry_secrets_ready=${ready}" >> "${GITHUB_OUTPUT}"

          want=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then want=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push_image }}" = "true" ]; then want=true; fi
          echo "want_push=${want}" >> "${GITHUB_OUTPUT}"

          should=false
          if [ "${ready}" = "true" ] && [ "${want}" = "true" ]; then should=true; fi
          echo "should_push=${should}" >> "${GITHUB_OUTPUT}"

      - name: Warn when registry push is skipped
        if: ${{ steps.publish.outputs.want_push == 'true' && steps.publish.outputs.should_push != 'true' }}
        run: |
          echo "::warning::Skipping registry push. Configure repository secrets ALIYUN_REGISTRY_USERNAME and ALIYUN_REGISTRY_PASSWORD to publish images after release."

      - name: Login to Aliyun Container Registry
        if: ${{ steps.publish.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value=${{ steps.soothe_version.outputs.version }},enable=${{ github.event_name == 'workflow_run' && steps.soothe_version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.soothe_version.outputs.version }},enable=${{ github.event_name == 'workflow_run' && steps.soothe_version.outputs.version != '' }}

      - name: Build and push daemon image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/soothe-daemon/Dockerfile
          build-args: |
            SOOTHE_VERSION=${{ steps.soothe_version.outputs.version }}
            SOOTHE_DAEMON_VERSION=${{ steps.soothe_version.outputs.version }}
            PYTHON_BASE=${{ env.PYTHON_BASE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
