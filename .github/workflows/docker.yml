name: Build Docker Image

on:
  workflow_run:
    workflows: ["Release Soothe Packages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      soothe_version:
        description: "Version for soothe / soothe-sdk / soothe-daemon wheels (omit for latest GitHub release in this repo)"
        required: false
        default: ""
        type: string
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: lacogito
  IMAGE_NAME: soothed

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Resolve release tag
        id: release_ref
        env:
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ github.event.inputs.soothe_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=""
          tag_ref=""

          if [ -n "${INPUT_VERSION// }" ]; then
            v="${INPUT_VERSION#v}"
            tag_ref="v${v}"
          else
            if ! json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/releases/latest")"; then
              json=""
            fi
            tag_ref="$(printf '%s' "$json" | jq -r 'try .tag_name // empty')"
            if [ -n "$tag_ref" ] && [ "$tag_ref" != "null" ]; then
              v="${tag_ref#v}"
            else
              tag_ref=""
            fi
          fi

          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "tag_ref=${tag_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ steps.release_ref.outputs.tag_ref || github.sha }}

      - name: Resolve Soothe version for Docker build
        id: soothe_version
        run: |
          set -euo pipefail
          v="${{ steps.release_ref.outputs.version }}"
          if [ -z "$v" ]; then
            echo "::warning::No GitHub release found or API failed; falling back to VERSION in checkout"
            v="$(tr -d ' \n\r\t' < VERSION)"
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Resolved SOOTHE_VERSION=${v}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry publish eligibility
        id: publish
        env:
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          ready=false
          if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASS}" ]; then ready=true; fi
          echo "registry_secrets_ready=${ready}" >> "${GITHUB_OUTPUT}"

          want=false
          if [ "${{ github.event_name }}" = "workflow_run" ]; then want=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push_image }}" = "true" ]; then want=true; fi
          echo "want_push=${want}" >> "${GITHUB_OUTPUT}"

          should=false
          if [ "${ready}" = "true" ] && [ "${want}" = "true" ]; then should=true; fi
          echo "should_push=${should}" >> "${GITHUB_OUTPUT}"

      - name: Fail if workflow_run requires registry secrets
        if: ${{ github.event_name == 'workflow_run' && steps.publish.outputs.registry_secrets_ready != 'true' }}
        run: |
          echo "::error::Configure repository secrets ALIYUN_REGISTRY_USERNAME and ALIYUN_REGISTRY_PASSWORD to push images after release."
          exit 1

      - name: Login to Aliyun Container Registry
        if: ${{ steps.publish.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=semver,pattern={{version}},value=v${{ steps.soothe_version.outputs.version }},enable=${{ github.event_name == 'workflow_run' && steps.soothe_version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.soothe_version.outputs.version }},enable=${{ github.event_name == 'workflow_run' && steps.soothe_version.outputs.version != '' }}

      - name: Build and push daemon image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/soothe-daemon/Dockerfile
          build-args: |
            SOOTHE_VERSION=${{ steps.soothe_version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
